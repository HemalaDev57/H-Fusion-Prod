apiVersion: automation.cloudbees.io/v1alpha1
kind: action
name: "Sync Public Action Versions"
description: "Directly pushes Docker image version updates to public action repositories"
inputs:
  app-id:
    required: true
    description: The GitHub application ID to use for pushing to public repos
  calculi-corp-installation-id:
    required: true
    description: The GitHub installation ID for the calculi-corp organization
  cloudbees-io-installation-id:
    required: true
    description: The GitHub installation ID for the cloudbees-io organization
  cloudbees-io-gha-installation-id:
    required: true
    description: The GitHub installation ID for the cloudbees-io-gha organization
  private-key-b64:
    required: true
    description: The PEM encoded private key of the GitHub application, Base64 encoded
  major-bump:
    required: false
    default: "false"
    description: The path to the action_artifacts.json file containing the updated action versions
outputs:
  evidence-report:
    description: Markdown formatted evidence report of all changes (commit-based)
    value: ${{ steps.sync.outputs.evidence }}

runs:
  using: composite
  steps:
    - name: Sync image versions in public repositories
      id: sync
      uses: docker://020229604682.dkr.ecr.us-east-1.amazonaws.com/containers/container-gh-cli-plus-gh-token:0.0.6
      run: |
        set -e

        EVIDENCE_FILE="/tmp/evidence_report.md"
        EVIDENCE_DATA_DIR="/tmp/evidence_data"
        mkdir -p "$EVIDENCE_DATA_DIR"
        ARTIFACTS_FILE="versioning/action_artifacts.json"
        ARTIFACTS_JSON='{"public":{"actions":{"temp-testing-repo-actions":"main-a38f8b3d8933c752b41206ac65f86cee7bbe2d2i"},"custom-jobs":{},"services":{}},"private":{},"skip":{"cassandra":"9.0.6","consul":"1.0.6","metrics-server":"3.11.0","postgresql":"1.1.6","reloader":"1.0.69"}}'
        MAPPING_FILE="actions/sync-public-action-versions/action-repo-mapping.json"

        if [ -z "$ARTIFACTS_JSON" ]; then
          echo "Input files $ARTIFACTS_JSON not found, skipping sync"
          exit 0
        fi

        if [ ! -f "$ARTIFACTS_FILE" ]; then
          echo "❌ ERROR: $ARTIFACTS_FILE not found"
          exit 1
        fi
        
        ACTION_NAMES=$(echo "$ARTIFACTS_JSON" | jq -r '.public.actions | keys[]')

        if [ -z "$ACTION_NAMES" ]; then
          echo "ℹ️  No changed actions detected"
          # Generate evidence report for no changes
          CLOUDBEES_RUN_ID="${{ cloudbees.run_id }}"
          CLOUDBEES_COMMIT_SHA="${{ cloudbees.scm.sha }}"
          CLOUDBEES_BRANCH="${{ cloudbees.scm.branch }}"
          GENERATED_TIME=$(date '+%Y-%m-%d %H:%M:%S UTC')
          cat > "$EVIDENCE_FILE" << EVIDENCE_NO_CHANGES
        ## Sync Public Action Versions - Evidence Report
        **Generated:** $GENERATED_TIME
        **Workflow Run:** $CLOUDBEES_RUN_ID
        **Commit:** $CLOUDBEES_COMMIT_SHA
        **Branch:** $CLOUDBEES_BRANCH
        ### Summary
        ℹ️ No action version changes detected in this commit.
        ---
        **Repository:** calculi-corp/platform-helmfiles
        EVIDENCE_NO_CHANGES
          if [ -f "$EVIDENCE_FILE" ]; then
          cat "$EVIDENCE_FILE" > $CLOUDBEES_OUTPUTS/evidence
          fi
          exit 0
        fi
        
        PLATFORM_HELMFILES_SCM_SHA="${{ cloudbees.scm.sha }}"
        PLATFORM_HELMFILES_REPO="${{ cloudbees.scm.repository }}"

        echo "🔄 Obtaining GitHub App Installation token for calculi-corp Org..."
        export GH_TOKEN="$(gh-token generate --app-id "${{ inputs.app-id }}" --installation-id "${{ inputs.calculi-corp-installation-id }}" --base64-key "${{ inputs.private-key-b64 }}" --token-only )"
        echo "✅ GitHub App Installation token obtained"
        echo "🔍 SCM SHA for platform-helmfiles: $PLATFORM_HELMFILES_SCM_SHA"
        echo "📋 Platform-helmfiles commit: https://github.com/$PLATFORM_HELMFILES_REPO/commit/$PLATFORM_HELMFILES_SCM_SHA"

        PREVIOUS_JSON=$(git show HEAD~1:"$ARTIFACTS_FILE" 2>/dev/null || echo "{}")

        # Validate previous JSON if not empty
        if [ "$PREVIOUS_JSON" != "{}" ] && ! echo "$PREVIOUS_JSON" | jq empty 2>/dev/null; then
          echo "⚠️  WARNING: Previous version of $ARTIFACTS_FILE contains invalid JSON, treating as empty"
          PREVIOUS_JSON="{}"
        fi
        
        for ACTION_NAME in $ACTION_NAMES; do
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "Processing: $ACTION_NAME"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

          NEW_VERSION=$(echo "$ARTIFACTS_JSON" | jq -r ".public.actions[\"$ACTION_NAME\"]")
          PREVIOUS_VERSION=$(echo "$PREVIOUS_JSON" | jq -r ".public.actions[\"$ACTION_NAME\"] // empty")

          echo "📦 Action: $ACTION_NAME"
          echo "🏷️  New version: $NEW_VERSION"
          echo "🏷️  Previous version: $PREVIOUS_VERSION"
            # Store for evidence using files
            echo "$PREVIOUS_VERSION" > "$EVIDENCE_DATA_DIR/${ACTION_NAME}.old_version"
            echo "$NEW_VERSION" > "$EVIDENCE_DATA_DIR/${ACTION_NAME}.new_version"
            echo "-" > "$EVIDENCE_DATA_DIR/${ACTION_NAME}.pr_url"
            echo "Processing" > "$EVIDENCE_DATA_DIR/${ACTION_NAME}.status"
        
          # Check if action should be skipped
          if [ -f "$MAPPING_FILE" ]; then
            IS_SKIPPED=$(jq -r ".skip // [] | map(select(. == \"$ACTION_NAME\")) | length > 0" "$MAPPING_FILE" 2>/dev/null || echo "false")
            if [ "$IS_SKIPPED" = "true" ]; then
              echo "⚠️  Action $ACTION_NAME is in skip list (no public repo mapping)"
              echo "⚠️  Skipping commit for this action."
              echo ""
              echo "⚠️ No public repo mapping (skipped)" > "$EVIDENCE_DATA_DIR/${ACTION_NAME}.status"
              continue
            fi
          fi
        
          # Check for mapping exceptions (all are arrays)
          PUBLIC_REPOS=""
        
          if [ -f "$MAPPING_FILE" ]; then
            # Extract array values as space-separated list
            PUBLIC_REPOS=$(jq -r ".exceptions[\"$ACTION_NAME\"] // [] | .[]" "$MAPPING_FILE" 2>/dev/null | tr '\n' ' ')
          fi
        
          # If no exception found, use standard naming patterns
          if [ -z "$PUBLIC_REPOS" ]; then
            # Check if action follows standard naming convention
            HAS_STANDARD_NAMING=false
        
            # For GHA actions: gha-* -> cloudbees-io-gha/*
            # For CBP actions: *-actions -> cloudbees-io/*
            if echo "$ACTION_NAME" | grep -q "^gha-"; then
              # GHA actions: gha-register-deployed-artifact -> register-deployed-artifact
              PUBLIC_REPO_NAME=$(echo "$ACTION_NAME" | sed 's/^gha-//')
              PUBLIC_REPOS="cloudbees-io-gha/$PUBLIC_REPO_NAME"
              HAS_STANDARD_NAMING=true
            elif echo "$ACTION_NAME" | grep -q -- "-actions$"; then
              # CBP actions: github-actions -> github
              PUBLIC_REPO_NAME=$(echo "$ACTION_NAME" | sed 's/-actions$//')
              PUBLIC_REPOS="cloudbees-io/$PUBLIC_REPO_NAME"
              HAS_STANDARD_NAMING=true
            else
              # Action doesn't follow naming convention and has no exception mapping
              echo "⚠️  WARNING: Action $ACTION_NAME doesn't follow standard naming convention (gha-* or *-actions)"
              echo "⚠️  and has no exception mapping in action-repo-mapping.json"
              echo "⚠️  Skipping commit for this action."
              echo ""
              echo "⚠️ Non-standard naming, no mapping" > "$EVIDENCE_DATA_DIR/${ACTION_NAME}.status"
              continue
            fi
          fi
        
          echo "🎯 Target public repository(s): $PUBLIC_REPOS"
        
          # Process each public repository
          for PUBLIC_REPO in $PUBLIC_REPOS; do
            echo ""
            echo "  📍 Processing repository: $PUBLIC_REPO"
            echo ""
        
          # Determine which installation ID to use based on the organization
          echo "🔄 Determining GitHub App installation ID for organization..."
          INSTALLATION_ID=""
          if echo "$PUBLIC_REPO" | grep -q "^cloudbees-io/"; then
            INSTALLATION_ID="${{ inputs.cloudbees-io-installation-id }}"
            echo "✅ Using cloudbees-io installation ID: $INSTALLATION_ID"
          elif echo "$PUBLIC_REPO" | grep -q "^cloudbees-io-gha/"; then
            INSTALLATION_ID="${{ inputs.cloudbees-io-gha-installation-id }}"
            echo "✅ Using cloudbees-io-gha installation ID: $INSTALLATION_ID"
          else
            echo "❌ ERROR: Unknown organization for repository $PUBLIC_REPO"
            echo "⚠️  Skipping commit for this action."
            echo ""
            continue
          fi
        
          # Validate installation ID is not empty
          if [ -z "$INSTALLATION_ID" ]; then
            echo "❌ ERROR: Installation ID is empty"
            echo "⚠️  Check that the CloudBees variables are configured:"
            echo "   - vars.cloudbees_io_installation_id"
            echo "   - vars.cloudbees_io_gha_installation_id"
            echo "⚠️  Skipping commit for this action."
            echo ""
            continue
          fi
        
          # Generate GitHub App Installation token for this organization
          echo "🔄 Obtaining GitHub App Installation token..."
          echo "🔍 Debug - App ID: ${{ inputs.app-id }}"
          echo "🔍 Debug - Installation ID: $INSTALLATION_ID"
          echo "🔍 Debug - Private key length: $(echo '${{ inputs.private-key-b64 }}' | wc -c)"
          GH_TOKEN_OUTPUT=$(gh-token generate --app-id "${{ inputs.app-id }}" --installation-id "$INSTALLATION_ID" --base64-key "${{ inputs.private-key-b64 }}" --token-only 2>&1)
          GH_TOKEN_EXIT_CODE=$?
        
          if [ $GH_TOKEN_EXIT_CODE -ne 0 ]; then
            echo "❌ ERROR: Failed to generate GitHub App Installation token"
            echo "Error details: $GH_TOKEN_OUTPUT"
            echo ""
            echo "Possible causes:"
            echo "  - Invalid or malformed private key (check base64 encoding)"
            echo "  - Incorrect app-id or installation-id"
            echo "  - Private key format issue (must be PEM encoded PKCS1 or PKCS8)"
            echo "⚠️  Skipping commit for this action."
            echo ""
            continue
          fi
        
          export GH_TOKEN="$GH_TOKEN_OUTPUT"
        
          # Validate token is not empty
          if [ -z "$GH_TOKEN" ] || [ "$GH_TOKEN" = "null" ]; then
            echo "❌ ERROR: GitHub token is empty or null"
            echo "⚠️  Skipping commit for this action."
            echo ""
            continue
          fi
        
          echo "✅ GitHub App Installation token obtained"
          echo ""
        
          # Check if public repository exists
          echo "🔄 Checking if public repository exists..."
          REPO_INFO=$(gh api repos/"$PUBLIC_REPO" 2>/dev/null)
          if [ -z "$REPO_INFO" ]; then
            echo "⚠️  WARNING: Repository $PUBLIC_REPO does not exist or is not accessible."
            echo "⚠️  Skipping commit for this action."
            echo ""
            echo "❌ Repo not accessible" > "$EVIDENCE_DATA_DIR/${ACTION_NAME}.status"
            continue
          fi
        
          # Check if repository is public
          REPO_PRIVATE=$(echo "$REPO_INFO" | jq -r '.private')
          if [ "$REPO_PRIVATE" = "true" ]; then
            echo "⚠️  WARNING: Repository $PUBLIC_REPO is PRIVATE, not PUBLIC."
            echo "⚠️  This script only syncs to public repositories."
            echo "⚠️  Skipping commit for this action."
            echo ""
            echo "❌ Private repo (skipped)" > "$EVIDENCE_DATA_DIR/${ACTION_NAME}.status"
            continue
          fi
          echo "✅ Public repository $PUBLIC_REPO exists and is public"
        
          echo "🔄 Determining default branch of $PUBLIC_REPO..."
          DEFAULT_BRANCH=$(gh api repos/"$PUBLIC_REPO" --jq '.default_branch')
          echo "✅ Default branch of $PUBLIC_REPO is $DEFAULT_BRANCH"

          # Try to find action.yml or action.yaml
          ACTION_FILE_PATH=""
          for filename in "action.yml" "action.yaml"; do
            echo "🔄 Checking if $filename exists in $PUBLIC_REPO..."
            if gh api repos/"$PUBLIC_REPO"/contents/"$filename"'?ref'="$DEFAULT_BRANCH" --silent 2>/dev/null; then
              ACTION_FILE_PATH="$filename"
              echo "✅ Found action file at $ACTION_FILE_PATH"
              break
            fi
          done

          if [ -z "$ACTION_FILE_PATH" ]; then
            echo "⚠️  ERROR: Neither action.yml nor action.yaml found in $PUBLIC_REPO"
            echo "⚠️  This action may use a different structure. Manual update required."
            echo ""
            echo "❌ No action file found" > "$EVIDENCE_DATA_DIR/${ACTION_NAME}.status"
            continue
          fi

          # Get current file content and SHA
          ACTION_FILE_CONTENT=$(gh api repos/"$PUBLIC_REPO"/contents/"$ACTION_FILE_PATH"'?ref'="$DEFAULT_BRANCH")
          CURRENT_FILE_SHA=$(printf '%s\n' "$ACTION_FILE_CONTENT" | jq -r '.sha')
          CURRENT_CONTENT=$(printf '%s\n' "$ACTION_FILE_CONTENT" | jq -r '.content' | base64 -d)

          # Extract current image version - match action name in image path
          # Look for docker://*/actions/${ACTION_NAME}: pattern
          IMAGE_PATTERN="actions/${ACTION_NAME}:"
          CURRENT_IMAGE=$(echo "$CURRENT_CONTENT" | grep -E '^\s*(image|uses):' | grep -E "docker://.*${IMAGE_PATTERN}" | head -1 | sed -E 's/^\s*(image|uses):\s*//' | tr -d '"' | tr -d "'" | xargs)

          # If not found, try without -actions suffix (e.g., plugin-blackduck-sca)
          if [ -z "$CURRENT_IMAGE" ]; then
            ALT_ACTION_NAME=$(echo "$ACTION_NAME" | sed 's/-actions$//')
            ALT_IMAGE_PATTERN="actions/${ALT_ACTION_NAME}:"
            CURRENT_IMAGE=$(echo "$CURRENT_CONTENT" | grep -E '^\s*(image|uses):' | grep -E "docker://.*${ALT_IMAGE_PATTERN}" | head -1 | sed -E 's/^\s*(image|uses):\s*//' | tr -d '"' | tr -d "'" | xargs)
            if [ -n "$CURRENT_IMAGE" ]; then
              IMAGE_PATTERN="$ALT_IMAGE_PATTERN"
            fi
          fi

          # If still not found, check if it's a Dockerfile-based action
          if [ -z "$CURRENT_IMAGE" ]; then
            DOCKERFILE_CHECK=$(echo "$CURRENT_CONTENT" | grep -E '^\s*(image|uses):' | grep -i "Dockerfile" | head -1)
            if [ -n "$DOCKERFILE_CHECK" ]; then
              echo "⚠️  WARNING: Image uses Dockerfile build"
              echo "⚠️  Skipping image version update. Dockerfile-based actions are built from source."
              echo ""
              echo "⚠️ Dockerfile-based (skipped)" > "$EVIDENCE_DATA_DIR/${ACTION_NAME}.status"
              continue
            fi

            # Check for any docker:// image (fallback for non-standard naming)
            CURRENT_IMAGE=$(echo "$CURRENT_CONTENT" | grep -E '^\s*(image|uses):' | grep -E 'docker://' | head -1 | sed -E 's/^\s*(image|uses):\s*//' | tr -d '"' | tr -d "'" | xargs)
            if [ -z "$CURRENT_IMAGE" ]; then
              echo "⚠️  WARNING: No docker:// image found for actions/${ACTION_NAME}"
              echo "⚠️  This action may use embedded plugins or different image format."
              echo "⚠️  Skipping image version update."
              echo ""
              echo "❌ No matching image found" > "$EVIDENCE_DATA_DIR/${ACTION_NAME}.status"
              continue
            else
              echo "⚠️  WARNING: Found docker:// image but doesn't match expected pattern 'actions/${ACTION_NAME}'"
              echo "   This might update the wrong image. Found: $CURRENT_IMAGE"
              echo "   Expected pattern: docker://*/actions/${ACTION_NAME}:*"
              echo ""
              echo "⚠️ Ambiguous image pattern" > "$EVIDENCE_DATA_DIR/${ACTION_NAME}.status"
              continue
            fi
          fi

          echo "📸 Current image: $CURRENT_IMAGE"

          # Extract current version from image
          CURRENT_VERSION=$(echo "$CURRENT_IMAGE" | grep -oE '[^:]+$' | xargs)
          echo "   Current version: $CURRENT_VERSION"

          # Check if already up-to-date BEFORE building new image
          if [ "$CURRENT_VERSION" = "$NEW_VERSION" ]; then
            echo "✅ Image is already at version $NEW_VERSION. No update needed."
            echo ""
            echo "✅ Already up-to-date" > "$EVIDENCE_DATA_DIR/${ACTION_NAME}.status"
            continue
          fi

          # Determine the new image path
          if echo "$CURRENT_IMAGE" | grep -q "^docker://"; then
            # Extract ECR registry path from current image
            REGISTRY_PATH=$(echo "$CURRENT_IMAGE" | sed 's|^docker://||' | sed 's|:.*$||' | xargs)
            NEW_IMAGE="docker://$REGISTRY_PATH:$NEW_VERSION"
          else
            echo "⚠️  WARNING: Unexpected image format: $CURRENT_IMAGE"
            echo "⚠️  Skipping image version update."
            echo ""
            echo "❌ Unexpected image format" > "$EVIDENCE_DATA_DIR/${ACTION_NAME}.status"
            continue
          fi

          echo "🆕 New image: $NEW_IMAGE"

          # Update the image in action file - use IMAGE_PATTERN for precise matching
          # This ensures we only replace the specific action image, not helper images
          ESCAPED_CURRENT_IMAGE=$(echo "$CURRENT_IMAGE" | sed 's|/|\\/|g')
          ESCAPED_NEW_IMAGE=$(echo "$NEW_IMAGE" | sed 's|/|\\/|g')
          NEW_CONTENT=$(echo "$CURRENT_CONTENT" | sed "s|${ESCAPED_CURRENT_IMAGE}|${ESCAPED_NEW_IMAGE}|g")
          ENCODED_CONTENT=$(echo "$NEW_CONTENT" | base64 -w 0)

          # Build commit message
          COMMIT_MSG="Update Docker image to $NEW_VERSION"

          # Extract Jira IDs from git log if we have version range
          PREVIOUS_VERSION=$(cat "$EVIDENCE_DATA_DIR/${ACTION_NAME}.old_version" 2>/dev/null || echo "")
          if [ -n "$PREVIOUS_VERSION" ] && [ "$PREVIOUS_VERSION" != "empty" ]; then
            echo "📜 Previous version: $PREVIOUS_VERSION"
          else
            echo "⚠️  No previous version found"
            PREVIOUS_VERSION=""
          fi

          JIRA_IDS=""
          if [ -n "$PREVIOUS_VERSION" ] && [ "$PREVIOUS_VERSION" != "$NEW_VERSION" ]; then
            echo "🔄 Extracting Jira IDs from commits..."
            GIT_LOG=$(git log --first-parent "${PREVIOUS_VERSION}..${NEW_VERSION}" --pretty=format:"%s%n%b" 2>/dev/null || echo "")
            if [ -n "$GIT_LOG" ]; then
              JIRA_IDS=$(printf '%s\n' "$GIT_LOG" | grep -oE '\[CBP-[0-9]+\]' | sort -u | tr -d '\n' || echo "")
            fi
          fi

          if [ -n "$JIRA_IDS" ]; then
            COMMIT_MSG="${JIRA_IDS} ${COMMIT_MSG}"
            echo "🎫 Found Jira IDs: $JIRA_IDS"
          fi

          echo "📝 Commit message: $COMMIT_MSG"

          # Commit the change directly to the default branch
          echo "🔄 Committing $ACTION_FILE_PATH directly to $DEFAULT_BRANCH..."
          COMMIT_RESPONSE=$(gh api repos/"$PUBLIC_REPO"/contents/"$ACTION_FILE_PATH" -X PUT \
            -f message="$COMMIT_MSG" \
            -f content="$ENCODED_CONTENT" \
            -f sha="$CURRENT_FILE_SHA" \
            -f branch="$DEFAULT_BRANCH")
          COMMIT_SHA=$(printf '%s\n' "$COMMIT_RESPONSE" | jq -r '.commit.sha')
          echo "✅ File $ACTION_FILE_PATH committed to $DEFAULT_BRANCH"
          echo ""
          echo "✅ Commit pushed: https://github.com/$PUBLIC_REPO/commit/$COMMIT_SHA"
          echo ""

          # Update evidence with commit info (append for multiple repos)
          COMMIT_URL="https://github.com/$PUBLIC_REPO/commit/$COMMIT_SHA"
          if [ -f "$EVIDENCE_DATA_DIR/${ACTION_NAME}.pr_url" ] && [ "$(cat "$EVIDENCE_DATA_DIR/${ACTION_NAME}.pr_url")" != "-" ]; then
            echo "$(cat "$EVIDENCE_DATA_DIR/${ACTION_NAME}.pr_url"), $COMMIT_URL" > "$EVIDENCE_DATA_DIR/${ACTION_NAME}.pr_url"
          else
            echo "$COMMIT_URL" > "$EVIDENCE_DATA_DIR/${ACTION_NAME}.pr_url"
          fi
          echo "✅ Committed to $DEFAULT_BRANCH" > "$EVIDENCE_DATA_DIR/${ACTION_NAME}.status"

          # Get version tags
          ACTION_MAJOR_VERSION=$(gh api repos/$PUBLIC_REPO/tags --jq '.[].name' | grep -E '^v[0-9]+$' | sort -V | tail -1)
          ACTION_MINOR_VERSION=$(gh api repos/$PUBLIC_REPO/tags --jq '.[].name' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)
          if [ -z "$ACTION_MAJOR_VERSION" ] || [ -z "$ACTION_MINOR_VERSION" ]; then
            echo "⚠️ Unable to find the MAJOR/MINOR version tags in $PUBLIC_REPO repository."
            echo "⚠️ Missing version tags in $PUBLIC_REPO" > "$EVIDENCE_DATA_DIR/${ACTION_NAME}.jira_ticket"
            continue
          fi

          MAJOR=$(echo $ACTION_MINOR_VERSION | cut -d. -f1)
          MINOR=$(echo $ACTION_MINOR_VERSION | cut -d. -f2)
          PATCH=$(echo $ACTION_MINOR_VERSION | cut -d. -f3)
          echo "📌 Latest MAJOR version tag: $ACTION_MAJOR_VERSION"
          echo "📌 Latest MINOR version tag: $ACTION_MINOR_VERSION"

          if [ ${{ inputs.major-bump }} = "true" ]; then
            MAJOR_VER=$(echo "$ACTION_MAJOR_VERSION" | sed 's/^v//')
            NEW_MINOR_VERSION="v$((MAJOR_VER + 1)).0.0"
            NEW_MAJOR_VERSION="v$((MAJOR_VER + 1))"
          else 
            NEW_PATCH_VERSION=$((PATCH + 1))
            NEW_MINOR_VERSION="${MAJOR}.${MINOR}.${NEW_PATCH_VERSION}"
            NEW_MAJOR_VERSION=$ACTION_MAJOR_VERSION
          fi
          echo "📌 New MAJOR version tag: $NEW_MAJOR_VERSION"
          echo "📌 New MINOR version tag: $NEW_MINOR_VERSION"

          # Create annotated tag for the new minor/patch version
          echo "🏷️  Creating tag $NEW_MINOR_VERSION at $COMMIT_SHA..."
          NEW_MINOR_TAG_SHA=$(gh api repos/"$PUBLIC_REPO"/git/tags -X POST \
            -f tag="$NEW_MINOR_VERSION" \
            -f message="Release $NEW_MINOR_VERSION" \
            -f object="$COMMIT_SHA" \
            -f type="commit" \
            --jq '.sha')
          gh api repos/"$PUBLIC_REPO"/git/refs -X POST \
            -f ref="refs/tags/$NEW_MINOR_VERSION" \
            -f sha="$NEW_MINOR_TAG_SHA"
          echo "✅ Tag $NEW_MINOR_VERSION created"

          # Force-update the major version tag to the same annotated tag object
          echo "🏷️  Updating major version tag $NEW_MAJOR_VERSION..."
          MAJOR_TAG_EXISTS=$(gh api repos/"$PUBLIC_REPO"/git/refs/tags/"$NEW_MAJOR_VERSION" 2>/dev/null \
            | jq -e --arg ref "refs/tags/$NEW_MAJOR_VERSION" \
            'if type == "array" then any(.[]; .ref == $ref) else .ref == $ref end' \
            >/dev/null 2>&1 && echo "true" || echo "false")
          if [ "$MAJOR_TAG_EXISTS" = "false" ]; then
            gh api repos/"$PUBLIC_REPO"/git/refs -X POST \
              -f ref="refs/tags/$NEW_MAJOR_VERSION" \
              -f sha="$NEW_MINOR_TAG_SHA"
            echo "✅ Major version tag $NEW_MAJOR_VERSION created"
          else
            gh api repos/"$PUBLIC_REPO"/git/refs/tags/"$NEW_MAJOR_VERSION" -X PATCH \
              -f sha="$NEW_MINOR_TAG_SHA" \
              -F force=true
            echo "✅ Major version tag $NEW_MAJOR_VERSION updated"
          fi
          # Create or update the GitHub release for the major version tag
          echo "🔄 Checking for existing release on $NEW_MAJOR_VERSION..."
          RELEASE_JSON=$(gh api repos/"$PUBLIC_REPO"/releases 2>/dev/null | \
          jq --arg tag "$NEW_MAJOR_VERSION" '[.[] | select(.tag_name == $tag)] | first // {}')
          RELEASE_ID=$(printf '%s\n' "$RELEASE_JSON" | jq -r '.id // empty')
          
          if [ "${{ inputs.major-bump }}" = "true" ] || [ -z "$RELEASE_ID" ]; then
            echo "🚀 Creating release $NEW_MAJOR_VERSION..."
            gh api repos/"$PUBLIC_REPO"/releases -X POST \
            -f tag_name="$NEW_MAJOR_VERSION" \
            -f name="$NEW_MAJOR_VERSION" \
            -f body="$COMMIT_MSG"
            echo "✅ Release $NEW_MAJOR_VERSION  created"
          else
            echo "🔄 Updating release $NEW_MAJOR_VERSION (prepending new notes)..."
            EXISTING_NOTES=$(printf '%s\n' "$RELEASE_JSON" | jq -r '.body // ""')
            if [ -n "$EXISTING_NOTES" ]; then
              UPDATED_NOTES=$(printf '%s\n\n%s' "$COMMIT_MSG" "$EXISTING_NOTES")
            else
              UPDATED_NOTES="$COMMIT_MSG"
            fi
            gh api repos/"$PUBLIC_REPO"/releases/"$RELEASE_ID" -X PATCH \
            -f tag_name="$NEW_MAJOR_VERSION" \
            -f body="$UPDATED_NOTES"
            echo "✅  Release $NEW_MAJOR_VERSION updated"
          fi

          # Update evidence status with tag info
          echo "✅ Committed ($NEW_MINOR_VERSION, $NEW_MAJOR_VERSION) Released version ($NEW_MAJOR_VERSION)" > "$EVIDENCE_DATA_DIR/${ACTION_NAME}.status"

          done  # for PUBLIC_REPO
        done  # for ACTION_NAME
        
        echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
        echo "Summary"
        echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
        echo "✅ Processed $CHANGED_COUNT changed action(s)"
        echo "🎯 Next steps:"
        echo "   1. Verify the commits pushed to public repositories"
        echo "   2. Create version tags in the public repositories"

        # Generate evidence report
        echo ""
        echo "🔄 Generating evidence report..."

        # Set variables for evidence report
        CLOUDBEES_RUN_ID="${{ cloudbees.run_id }}"
        CLOUDBEES_COMMIT_SHA="${{ cloudbees.scm.sha }}"
        CLOUDBEES_BRANCH="${{ cloudbees.scm.branch }}"
        GENERATED_TIME=$(date '+%Y-%m-%d %H:%M:%S UTC')

        # Initialize evidence report with proper formatting
        cat > "$EVIDENCE_FILE" << EVIDENCE_HEADER
        ## Sync Public Action Versions - Evidence Report

        **Generated:** $GENERATED_TIME
        **Workflow Run:** $CLOUDBEES_RUN_ID
        **Commit:** $CLOUDBEES_COMMIT_SHA
        **Branch:** $CLOUDBEES_BRANCH

        ### Actions Changed

        | Action Name | Old Version | New Version | Commit | Status |
        |-------------|-------------|-------------|--------|--------|
        EVIDENCE_HEADER

        # Count statistics
        SUCCESS_COUNT=0
        ERROR_COUNT=0

        # Build evidence table rows
        for ACTION_NAME in $ACTION_NAMES; do
          OLD_VER=$(cat "$EVIDENCE_DATA_DIR/${ACTION_NAME}.old_version" 2>/dev/null || echo "unknown")
          NEW_VER=$(cat "$EVIDENCE_DATA_DIR/${ACTION_NAME}.new_version" 2>/dev/null || echo "unknown")
          PR_URL=$(cat "$EVIDENCE_DATA_DIR/${ACTION_NAME}.pr_url" 2>/dev/null || echo "-")
          STATUS=$(cat "$EVIDENCE_DATA_DIR/${ACTION_NAME}.status" 2>/dev/null || echo "Unknown")

          # Truncate versions for display (keep first 35 chars)
          OLD_VER_SHORT="$OLD_VER"
          NEW_VER_SHORT="$NEW_VER"
          if [ ${#OLD_VER} -gt 35 ]; then
            OLD_VER_SHORT="$(echo "$OLD_VER" | head -c 32)..."
          fi
          if [ ${#NEW_VER} -gt 35 ]; then
            NEW_VER_SHORT="$(echo "$NEW_VER" | head -c 32)..."
          fi

          # Format commit URL(s) for markdown (handle comma-separated multiple URLs)
          case "$PR_URL" in
            *,*)
              # Multiple URLs - format each
              PR_LINK=""
              IDX=1
              for URL in $(echo "$PR_URL" | tr ',' ' '); do
                if [ -n "$PR_LINK" ]; then
                  PR_LINK="$PR_LINK, [commit $IDX]($URL)"
                else
                  PR_LINK="[commit $IDX]($URL)"
                fi
                IDX=$((IDX + 1))
              done
              ;;
            https://*)
              COMMIT_SHORT=$(echo "$PR_URL" | grep -oE '[0-9a-f]{40}$' | head -c 7)
              if [ -z "$COMMIT_SHORT" ]; then
                COMMIT_SHORT="commit"
              fi
              PR_LINK="[$COMMIT_SHORT]($PR_URL)"
              ;;
            *)
              PR_LINK="$PR_URL"
              ;;
          esac

          # Count statistics
          case "$STATUS" in
            *"✅"*)
              SUCCESS_COUNT=$((SUCCESS_COUNT + 1))
              ;;
            *"❌"*|*"⚠️"*)
              ERROR_COUNT=$((ERROR_COUNT + 1))
              ;;
          esac

          # Add table row
          echo "| $ACTION_NAME | \`$OLD_VER_SHORT\` | \`$NEW_VER_SHORT\` | $PR_LINK | $STATUS |" >> "$EVIDENCE_FILE"
        done

        # Add summary section
        cat >> "$EVIDENCE_FILE" << EVIDENCE_FOOTER

        ---

        ### Summary Statistics

        - **Total Actions Changed:** $CHANGED_COUNT
        - **Successful Commits:** $SUCCESS_COUNT
        - **Errors/Warnings:** $ERROR_COUNT

        ### Next Steps

        1. ✅ Verify commits pushed to public repositories
        2. 🏷️ Verify release tags are created in public repositories

        ---

        **Repository:** calculi-corp/platform-helmfiles
        EVIDENCE_FOOTER

        # Output evidence to CloudBees output
        if [ -f "$EVIDENCE_FILE" ]; then
          cat "$EVIDENCE_FILE" > $CLOUDBEES_OUTPUTS/evidence
          echo "✅ Evidence report generated and saved to outputs"
        else
          echo "❌ ERROR: Evidence file not created"
        fi
