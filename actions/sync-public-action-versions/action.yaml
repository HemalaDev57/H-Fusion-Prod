apiVersion: automation.cloudbees.io/v1alpha1
kind: action
name: "Sync Public Action Versions"
description: "Creates/updates pull requests to sync Docker image versions in public action repositories"
inputs:
  app-id:
    required: true
    description: The GitHub application ID to use for creating PRs in public repos
  installation-id:
    required: true
    description: The GitHub installation ID for the GitHub application
  private-key-b64:
    required: true
    description: The PEM encoded private key of the GitHub application, Base64 encoded
runs:
  using: composite
  steps:
    - name: Get source code
      uses: cloudbees-io/checkout@v2
      with:
        fetch-depth: 0

    - name: Sync image versions in public repositories
      uses: docker://020229604682.dkr.ecr.us-east-1.amazonaws.com/containers/container-gh-cli-plus-gh-token:0.0.6
      run: |
        set -e

        echo "🔄 Obtaining GitHub App Installation token..."
        export GH_TOKEN="$(gh-token generate --app-id "${{ inputs.app-id }}" --installation-id "${{ inputs.installation-id }}" --base64-key "${{ inputs.private-key-b64 }}" --token-only )"
        echo "✅ GitHub App Installation token obtained"
        echo ""

        ARTIFACTS_JSON="versioning/action_artifacts.json"

        if [ ! -f "$ARTIFACTS_JSON" ]; then
          echo "❌ ERROR: $ARTIFACTS_JSON not found"
          exit 1
        fi

        # Detect which actions changed
        echo "🔍 Detecting which actions changed..."
        CURRENT_JSON=$(cat "$ARTIFACTS_JSON")

        # Validate current JSON
        if ! echo "$CURRENT_JSON" | jq empty 2>/dev/null; then
          echo "❌ ERROR: $ARTIFACTS_JSON contains invalid JSON"
          exit 1
        fi

        PREVIOUS_JSON=$(git show HEAD~1:"$ARTIFACTS_JSON" 2>/dev/null || echo "{}")

        # Validate previous JSON if not empty
        if [ "$PREVIOUS_JSON" != "{}" ] && ! echo "$PREVIOUS_JSON" | jq empty 2>/dev/null; then
          echo "⚠️  WARNING: Previous version of $ARTIFACTS_JSON contains invalid JSON, treating as empty"
          PREVIOUS_JSON="{}"
        fi

        CHANGED_ACTIONS=""
        ACTION_NAMES=$(echo "$CURRENT_JSON" | jq -r '.public.actions | keys[]')

        for ACTION_NAME in $ACTION_NAMES; do
          CURRENT_VERSION=$(echo "$CURRENT_JSON" | jq -r ".public.actions[\"$ACTION_NAME\"]")
          PREVIOUS_VERSION=$(echo "$PREVIOUS_JSON" | jq -r ".public.actions[\"$ACTION_NAME\"] // empty")

          if [ "$CURRENT_VERSION" != "$PREVIOUS_VERSION" ]; then
            echo "  📦 Changed: $ACTION_NAME ($PREVIOUS_VERSION → $CURRENT_VERSION)"
            if [ -z "$CHANGED_ACTIONS" ]; then
              CHANGED_ACTIONS="$ACTION_NAME"
            else
              CHANGED_ACTIONS="${CHANGED_ACTIONS} ${ACTION_NAME}"
            fi
          fi
        done

        if [ -z "$CHANGED_ACTIONS" ]; then
          echo "ℹ️  No changed actions detected"
          exit 0
        fi

        CHANGED_COUNT=$(echo "$CHANGED_ACTIONS" | wc -w)
        echo ""
        echo "✅ Found $CHANGED_COUNT changed action(s)"
        echo ""

        # Define mapping file path (constant across all actions)
        MAPPING_FILE="actions/sync-public-action-versions/action-repo-mapping.json"

        # Process each changed action
        for ACTION_NAME in $CHANGED_ACTIONS; do
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "Processing: $ACTION_NAME"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo ""

          # Read the new version
          NEW_VERSION=$(jq -r ".public.actions[\"$ACTION_NAME\"]" "$ARTIFACTS_JSON")

          echo "📦 Action: $ACTION_NAME"
          echo "🏷️  New version: $NEW_VERSION"

          # Check for mapping exceptions first
          PUBLIC_REPO=""

          if [ -f "$MAPPING_FILE" ]; then
            PUBLIC_REPO=$(jq -r ".exceptions[\"$ACTION_NAME\"] // empty" "$MAPPING_FILE" 2>/dev/null || echo "")
          fi

          # If no exception found, use standard naming patterns
          if [ -z "$PUBLIC_REPO" ]; then
            # For GHA actions: gha-* -> cloudbees-io-gha/*
            # For CBP actions: *-actions -> cloudbees-io/*
            if echo "$ACTION_NAME" | grep -q "^gha-"; then
              # GHA actions: gha-register-deployed-artifact -> register-deployed-artifact
              PUBLIC_REPO_NAME=$(echo "$ACTION_NAME" | sed 's/^gha-//')
              PUBLIC_REPO="cloudbees-io-gha/$PUBLIC_REPO_NAME"
            else
              # CBP actions: github-actions -> github
              PUBLIC_REPO_NAME=$(echo "$ACTION_NAME" | sed 's/-actions$//')
              PUBLIC_REPO="cloudbees-io/$PUBLIC_REPO_NAME"
            fi
          fi

          echo "🎯 Target public repository: $PUBLIC_REPO"

          # Check if public repository exists
          echo "🔄 Checking if public repository exists..."
          if ! gh api repos/"$PUBLIC_REPO" --silent 2>/dev/null; then
            echo "⚠️  WARNING: Public repository $PUBLIC_REPO does not exist or is not accessible."
            echo "⚠️  Skipping PR creation for this action."
            echo ""
            continue
          fi
          echo "✅ Public repository $PUBLIC_REPO exists"

          BRANCH="update-image-${NEW_VERSION}"

          echo "🔄 Determining default branch of $PUBLIC_REPO..."
          DEFAULT_BRANCH=$(gh api repos/"$PUBLIC_REPO" --jq '.default_branch')
          echo "✅ Default branch of $PUBLIC_REPO is $DEFAULT_BRANCH"

          echo "🔄 Determining latest commit of $DEFAULT_BRANCH branch..."
          LATEST_MAIN_SHA=$(gh api repos/"$PUBLIC_REPO"/git/ref/heads/"$DEFAULT_BRANCH" --jq '.object.sha')
          echo "✅ Latest commit of $DEFAULT_BRANCH is $LATEST_MAIN_SHA"

          # Try to find action.yml or action.yaml
          ACTION_FILE_PATH=""
          for filename in "action.yml" "action.yaml"; do
            echo "🔄 Checking if $filename exists in $PUBLIC_REPO..."
            if gh api repos/"$PUBLIC_REPO"/contents/"$filename"'?ref'="$DEFAULT_BRANCH" --silent 2>/dev/null; then
              ACTION_FILE_PATH="$filename"
              echo "✅ Found action file at $ACTION_FILE_PATH"
              break
            fi
          done

          if [ -z "$ACTION_FILE_PATH" ]; then
            echo "⚠️  ERROR: Neither action.yml nor action.yaml found in $PUBLIC_REPO"
            echo "⚠️  This action may use a different structure. Manual update required."
            echo ""
            continue
          fi

          # Get current file content and SHA
          ACTION_FILE_CONTENT=$(gh api repos/"$PUBLIC_REPO"/contents/"$ACTION_FILE_PATH"'?ref'="$DEFAULT_BRANCH")
          CURRENT_FILE_SHA=$(printf '%s\n' "$ACTION_FILE_CONTENT" | jq -r '.sha')
          CURRENT_CONTENT=$(printf '%s\n' "$ACTION_FILE_CONTENT" | jq -r '.content' | base64 -d)

          # Extract current image version (handle both docker:// and Dockerfile patterns)
          CURRENT_IMAGE=$(echo "$CURRENT_CONTENT" | grep -E '^\s*image:' | head -1 | sed -E 's/^\s*image:\s*//' | tr -d '"' | tr -d "'")
          echo "📸 Current image: $CURRENT_IMAGE"

          # Determine the new image path
          if echo "$CURRENT_IMAGE" | grep -q "^docker://"; then
            # Extract ECR registry path from current image
            REGISTRY_PATH=$(echo "$CURRENT_IMAGE" | sed 's|^docker://||' | sed 's|:.*$||')
            NEW_IMAGE="docker://$REGISTRY_PATH:$NEW_VERSION"
          elif echo "$CURRENT_IMAGE" | grep -q "Dockerfile"; then
            echo "⚠️  WARNING: Image uses Dockerfile build: $CURRENT_IMAGE"
            echo "⚠️  Skipping image version update. Dockerfile-based actions are built from source."
            echo ""
            continue
          else
            echo "⚠️  WARNING: Unexpected image format: $CURRENT_IMAGE"
            echo "⚠️  Skipping image version update."
            echo ""
            continue
          fi

          echo "🆕 New image: $NEW_IMAGE"

          # Check if update is needed
          if [ "$CURRENT_IMAGE" = "$NEW_IMAGE" ]; then
            echo "✅ Image is already at version $NEW_VERSION. No update needed."
            echo ""
            continue
          fi

          # Create or update branch
          echo "🔄 Checking if $BRANCH branch already exists in $PUBLIC_REPO..."
          BRANCH_REF=$(gh api repos/"$PUBLIC_REPO"/git/refs/heads/"$BRANCH" --silent 2>/dev/null || echo "false")

          if [ "$BRANCH_REF" = "false" ]; then
            echo "🔄 Creating $BRANCH in $PUBLIC_REPO..."
            gh api repos/"$PUBLIC_REPO"/git/refs -X POST -f ref="refs/heads/$BRANCH" -f sha="$LATEST_MAIN_SHA" || exit 1
            echo "✅ Branch $BRANCH created from $DEFAULT_BRANCH"
          else
            echo "🔄 Updating $BRANCH in $PUBLIC_REPO to match $DEFAULT_BRANCH..."
            gh api repos/"$PUBLIC_REPO"/git/refs/heads/"$BRANCH" -X PATCH -f sha="$LATEST_MAIN_SHA" -F "force=true" || exit 1
            echo "✅ Branch $BRANCH updated to match $DEFAULT_BRANCH"
          fi

          # Update the image in action file
          NEW_CONTENT=$(echo "$CURRENT_CONTENT" | sed -E "s|image:.*$REGISTRY_PATH:[^[:space:]]*|image: $NEW_IMAGE|")
          ENCODED_CONTENT=$(echo "$NEW_CONTENT" | base64 -w 0)

          # Commit the change
          echo "🔄 Updating $ACTION_FILE_PATH with new image version..."
          gh api repos/"$PUBLIC_REPO"/contents/"$ACTION_FILE_PATH" -X PUT \
            -f message="Update Docker image to $NEW_VERSION" \
            -f content="$ENCODED_CONTENT" \
            -f sha="$CURRENT_FILE_SHA" \
            -f branch="$BRANCH"
          echo "✅ File $ACTION_FILE_PATH updated on branch $BRANCH"

          # Build PR title and body
          PR_TITLE="Update Docker image to $NEW_VERSION"
          PR_BODY="This PR updates the Docker image to version \`$NEW_VERSION\`."

          # Get previous version from git history (main branch)
          PREVIOUS_VERSION=""
          echo "🔄 Extracting previous version from main branch..."
          PREV_VERSION_CONTENT=$(git show origin/main:versioning/action_artifacts.json 2>/dev/null || echo "{}")

          if [ -n "$PREV_VERSION_CONTENT" ] && echo "$PREV_VERSION_CONTENT" | jq empty 2>/dev/null; then
            PREVIOUS_VERSION=$(echo "$PREV_VERSION_CONTENT" | jq -r ".public.actions[\"$ACTION_NAME\"] // empty" 2>/dev/null || echo "")
          fi

          if [ -n "$PREVIOUS_VERSION" ]; then
            echo "📜 Previous version: $PREVIOUS_VERSION"
          else
            echo "⚠️  No previous version found in main branch"
          fi

          # Construct comparison URL if we have previous version
          COMPARE_URL=""
          if [ -n "$PREVIOUS_VERSION" ] && [ "$PREVIOUS_VERSION" != "$NEW_VERSION" ]; then
            # Try to get source repository from CloudBees context
            SOURCE_REPO="${{ cloudbees.scm.repository }}"
            if [ -z "$SOURCE_REPO" ]; then
              # Fallback: construct from action name
              SOURCE_REPO="calculi-corp/$ACTION_NAME"
            fi
            COMPARE_URL="https://github.com/${SOURCE_REPO}/compare/${PREVIOUS_VERSION}...${NEW_VERSION}"
            echo "📊 Comparison URL: ${COMPARE_URL}"
            PR_BODY=$(printf '%s\n\n### Changes\n[View changes between %s and %s](%s)' "$PR_BODY" "$PREVIOUS_VERSION" "$NEW_VERSION" "$COMPARE_URL")
          fi

          # Extract Jira IDs from git log if in source repository
          JIRA_IDS=""
          if [ -n "$PREVIOUS_VERSION" ] && [ "$PREVIOUS_VERSION" != "$NEW_VERSION" ]; then
            echo "🔄 Extracting Jira IDs from commits..."
            GIT_LOG=$(git log --first-parent "${PREVIOUS_VERSION}..${NEW_VERSION}" --pretty=format:"%s%n%b" 2>/dev/null || echo "")
            if [ -n "$GIT_LOG" ]; then
              JIRA_IDS=$(printf '%s\n' "$GIT_LOG" | grep -oE '\[CBP-[0-9]+\]' | sort -u | tr -d '\n' || echo "")
            fi
          fi

          if [ -n "$JIRA_IDS" ]; then
            PR_TITLE="${JIRA_IDS} ${PR_TITLE}"
            echo "🎫 Found Jira IDs: $JIRA_IDS"
          fi

          # Add note about draft status and SRE ticket
          PR_BODY=$(printf '%s\n\n---\n\n⚠️ **Note:** This PR should remain in DRAFT status until the Docker image is available in the public registry.\n\nA Jira ticket should be created for SRE to:\n1. Merge this PR\n2. Create a new tag for the release\n\nRelated: CBP-36642' "$PR_BODY")

          echo "📝 PR Title: $PR_TITLE"

          # Check for existing PR
          echo "🔄 Checking for pre-existing pull request..."
          EXISTING_PR=$(gh api repos/"$PUBLIC_REPO"/pulls --jq '.[] | select(.head.ref == "'"$BRANCH"'") | .number' | head -n 1)

          if [ -z "$EXISTING_PR" ]; then
            echo "🔄 Creating a new DRAFT pull request..."
            EXISTING_PR=$(gh api repos/"$PUBLIC_REPO"/pulls -X POST \
              -f title="$PR_TITLE" \
              -f head="$BRANCH" \
              -f base="$DEFAULT_BRANCH" \
              -f body="$PR_BODY" \
              -F draft=true \
              --jq '.number')
            echo "✅ Draft pull request created from $BRANCH to $DEFAULT_BRANCH"
          else
            PR_STATE=$(gh api repos/"$PUBLIC_REPO"/pulls/"$EXISTING_PR" --jq '.state')
            if [ "$PR_STATE" = "closed" ]; then
              gh api repos/"$PUBLIC_REPO"/pulls/"$EXISTING_PR" -X PATCH \
                -f state="open" \
                -f title="$PR_TITLE" \
                -f body="$PR_BODY" \
                -F draft=true
              echo "✅ Reopened pull request #$EXISTING_PR as draft"
            else
              gh api repos/"$PUBLIC_REPO"/pulls/"$EXISTING_PR" -X PATCH \
                -f title="$PR_TITLE" \
                -f body="$PR_BODY"
              echo "✅ Pull request #$EXISTING_PR updated"
            fi
          fi

          echo ""
          echo "✅ Draft pull request created at https://github.com/$PUBLIC_REPO/pull/$EXISTING_PR"
          echo ""
        done

        echo ""
        echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
        echo "Summary"
        echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
        echo "✅ Processed $CHANGED_COUNT changed action(s)"
        echo ""
        echo "🎯 Next steps:"
        echo "   1. Review the draft PRs created in public repositories"
        echo "   2. Verify Docker images are available in public registry"
        echo "   3. Create Jira ticket for SRE (related to CBP-36642)"
        echo "   4. SRE will merge PRs and create release tags"
