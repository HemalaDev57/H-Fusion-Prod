apiVersion: automation.cloudbees.io/v1alpha1
kind: action
name: "Sync Public Action Versions"
description: "Creates/updates pull requests to sync Docker image versions in public action repositories"
inputs:
  app-id:
    required: true
    description: The GitHub application ID to use for creating PRs in public repos
  cloudbees-io-installation-id:
    required: true
    description: The GitHub installation ID for the cloudbees-io organization
  cloudbees-io-gha-installation-id:
    required: true
    description: The GitHub installation ID for the cloudbees-io-gha organization
  private-key-b64:
    required: true
    description: The PEM encoded private key of the GitHub application, Base64 encoded
  jira-api-token:
    required: true
    description: Jira API token for creating tickets

outputs:
  evidence-report:
    description: Markdown formatted evidence report of all changes
    value: ${{ steps.sync.outputs.evidence }}

runs:
  using: composite
  steps:
    - name: Get source code
      uses: cloudbees-io/checkout@v2
      with:
        fetch-depth: 0

    - name: Sync image versions in public repositories
      id: sync
      uses: docker://020229604682.dkr.ecr.us-east-1.amazonaws.com/containers/container-gh-cli-plus-gh-token:0.0.6
      run: |
        set -e

        ARTIFACTS_JSON="versioning/action_artifacts.json"
        EVIDENCE_FILE="/tmp/evidence_report.md"
        EVIDENCE_DATA_DIR="/tmp/evidence_data"
        mkdir -p "$EVIDENCE_DATA_DIR"

        if [ ! -f "$ARTIFACTS_JSON" ]; then
          echo "❌ ERROR: $ARTIFACTS_JSON not found"
          exit 1
        fi

        # Detect which actions changed
        echo "🔍 Detecting which actions changed..."
        CURRENT_JSON=$(cat "$ARTIFACTS_JSON")

        # Validate current JSON
        if ! echo "$CURRENT_JSON" | jq empty 2>/dev/null; then
          echo "❌ ERROR: $ARTIFACTS_JSON contains invalid JSON"
          exit 1
        fi

        PREVIOUS_JSON=$(git show HEAD~1:"$ARTIFACTS_JSON" 2>/dev/null || echo "{}")

        # Validate previous JSON if not empty
        if [ "$PREVIOUS_JSON" != "{}" ] && ! echo "$PREVIOUS_JSON" | jq empty 2>/dev/null; then
          echo "⚠️  WARNING: Previous version of $ARTIFACTS_JSON contains invalid JSON, treating as empty"
          PREVIOUS_JSON="{}"
        fi

        CHANGED_ACTIONS=""
        ACTION_NAMES=$(echo "$CURRENT_JSON" | jq -r '.public.actions | keys[]')

        for ACTION_NAME in $ACTION_NAMES; do
          CURRENT_VERSION=$(echo "$CURRENT_JSON" | jq -r ".public.actions[\"$ACTION_NAME\"]")
          PREVIOUS_VERSION=$(echo "$PREVIOUS_JSON" | jq -r ".public.actions[\"$ACTION_NAME\"] // empty")

          if [ "$CURRENT_VERSION" != "$PREVIOUS_VERSION" ]; then
            echo "  📦 Changed: $ACTION_NAME ($PREVIOUS_VERSION → $CURRENT_VERSION)"
            if [ -z "$CHANGED_ACTIONS" ]; then
              CHANGED_ACTIONS="$ACTION_NAME"
            else
              CHANGED_ACTIONS="${CHANGED_ACTIONS} ${ACTION_NAME}"
            fi

            # Store for evidence using files
            echo "$PREVIOUS_VERSION" > "$EVIDENCE_DATA_DIR/${ACTION_NAME}.old_version"
            echo "$CURRENT_VERSION" > "$EVIDENCE_DATA_DIR/${ACTION_NAME}.new_version"
            echo "-" > "$EVIDENCE_DATA_DIR/${ACTION_NAME}.pr_url"
            echo "Processing" > "$EVIDENCE_DATA_DIR/${ACTION_NAME}.status"
          fi
        done

        if [ -z "$CHANGED_ACTIONS" ]; then
          echo "ℹ️  No changed actions detected"

          # Generate evidence report for no changes
          CLOUDBEES_RUN_ID="${{ cloudbees.run_id }}"
          CLOUDBEES_COMMIT_SHA="${{ cloudbees.scm.sha }}"
          CLOUDBEES_BRANCH="${{ cloudbees.scm.branch }}"
          GENERATED_TIME=$(date '+%Y-%m-%d %H:%M:%S UTC')

          cat > "$EVIDENCE_FILE" << EVIDENCE_NO_CHANGES
        ## Sync Public Action Versions - Evidence Report

        **Generated:** $GENERATED_TIME
        **Workflow Run:** $CLOUDBEES_RUN_ID
        **Commit:** $CLOUDBEES_COMMIT_SHA
        **Branch:** $CLOUDBEES_BRANCH

        ### Summary

        ℹ️ No action version changes detected in this commit.

        ---

        **Repository:** calculi-corp/platform-helmfiles
        EVIDENCE_NO_CHANGES

          if [ -f "$EVIDENCE_FILE" ]; then
            cat "$EVIDENCE_FILE" > $CLOUDBEES_OUTPUTS/evidence
          fi

          exit 0
        fi

        CHANGED_COUNT=$(echo "$CHANGED_ACTIONS" | wc -w)
        echo ""
        echo "✅ Found $CHANGED_COUNT changed action(s)"
        echo ""

        # Define mapping file path (constant across all actions)
        MAPPING_FILE="actions/sync-public-action-versions/action-repo-mapping.json"

        # Process each changed action
        for ACTION_NAME in $CHANGED_ACTIONS; do
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "Processing: $ACTION_NAME"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo ""

          # Read the new version
          NEW_VERSION=$(jq -r ".public.actions[\"$ACTION_NAME\"]" "$ARTIFACTS_JSON")

          echo "📦 Action: $ACTION_NAME"
          echo "🏷️  New version: $NEW_VERSION"

          # Check if action should be skipped
          if [ -f "$MAPPING_FILE" ]; then
            IS_SKIPPED=$(jq -r ".skip // [] | map(select(. == \"$ACTION_NAME\")) | length > 0" "$MAPPING_FILE" 2>/dev/null || echo "false")
            if [ "$IS_SKIPPED" = "true" ]; then
              echo "⚠️  Action $ACTION_NAME is in skip list (no public repo mapping)"
              echo "⚠️  Skipping PR creation for this action."
              echo ""
              echo "⚠️ No public repo mapping (skipped)" > "$EVIDENCE_DATA_DIR/${ACTION_NAME}.status"
              continue
            fi
          fi

          # Check for mapping exceptions (all are arrays)
          PUBLIC_REPOS=""

          if [ -f "$MAPPING_FILE" ]; then
            # Extract array values as space-separated list
            PUBLIC_REPOS=$(jq -r ".exceptions[\"$ACTION_NAME\"] // [] | .[]" "$MAPPING_FILE" 2>/dev/null | tr '\n' ' ')
          fi

          # If no exception found, use standard naming patterns
          if [ -z "$PUBLIC_REPOS" ]; then
            # Check if action follows standard naming convention
            HAS_STANDARD_NAMING=false

            # For GHA actions: gha-* -> cloudbees-io-gha/*
            # For CBP actions: *-actions -> cloudbees-io/*
            if echo "$ACTION_NAME" | grep -q "^gha-"; then
              # GHA actions: gha-register-deployed-artifact -> register-deployed-artifact
              PUBLIC_REPO_NAME=$(echo "$ACTION_NAME" | sed 's/^gha-//')
              PUBLIC_REPOS="cloudbees-io-gha/$PUBLIC_REPO_NAME"
              HAS_STANDARD_NAMING=true
            elif echo "$ACTION_NAME" | grep -q -- "-actions$"; then
              # CBP actions: github-actions -> github
              PUBLIC_REPO_NAME=$(echo "$ACTION_NAME" | sed 's/-actions$//')
              PUBLIC_REPOS="cloudbees-io/$PUBLIC_REPO_NAME"
              HAS_STANDARD_NAMING=true
            else
              # Action doesn't follow naming convention and has no exception mapping
              echo "⚠️  WARNING: Action $ACTION_NAME doesn't follow standard naming convention (gha-* or *-actions)"
              echo "⚠️  and has no exception mapping in action-repo-mapping.json"
              echo "⚠️  Skipping PR creation for this action."
              echo ""
              echo "⚠️ Non-standard naming, no mapping" > "$EVIDENCE_DATA_DIR/${ACTION_NAME}.status"
              continue
            fi
          fi

          echo "🎯 Target public repository(s): $PUBLIC_REPOS"

          # Process each public repository
          for PUBLIC_REPO in $PUBLIC_REPOS; do
            echo ""
            echo "  📍 Processing repository: $PUBLIC_REPO"
            echo ""

          # Determine which installation ID to use based on the organization
          echo "🔄 Determining GitHub App installation ID for organization..."
          INSTALLATION_ID=""
          if echo "$PUBLIC_REPO" | grep -q "^cloudbees-io/"; then
            INSTALLATION_ID="${{ inputs.cloudbees-io-installation-id }}"
            echo "✅ Using cloudbees-io installation ID: $INSTALLATION_ID"
          elif echo "$PUBLIC_REPO" | grep -q "^cloudbees-io-gha/"; then
            INSTALLATION_ID="${{ inputs.cloudbees-io-gha-installation-id }}"
            echo "✅ Using cloudbees-io-gha installation ID: $INSTALLATION_ID"
          else
            echo "❌ ERROR: Unknown organization for repository $PUBLIC_REPO"
            echo "⚠️  Skipping PR creation for this action."
            echo ""
            continue
          fi

          # Validate installation ID is not empty
          if [ -z "$INSTALLATION_ID" ]; then
            echo "❌ ERROR: Installation ID is empty"
            echo "⚠️  Check that the CloudBees variables are configured:"
            echo "   - vars.cloudbees_io_installation_id"
            echo "   - vars.cloudbees_io_gha_installation_id"
            echo "⚠️  Skipping PR creation for this action."
            echo ""
            continue
          fi

          # Generate GitHub App Installation token for this organization
          echo "🔄 Obtaining GitHub App Installation token..."
          echo "🔍 Debug - App ID: ${{ inputs.app-id }}"
          echo "🔍 Debug - Installation ID: $INSTALLATION_ID"
          echo "🔍 Debug - Private key length: $(echo '${{ inputs.private-key-b64 }}' | wc -c)"
          GH_TOKEN_OUTPUT=$(gh-token generate --app-id "${{ inputs.app-id }}" --installation-id "$INSTALLATION_ID" --base64-key "${{ inputs.private-key-b64 }}" --token-only 2>&1)
          GH_TOKEN_EXIT_CODE=$?

          if [ $GH_TOKEN_EXIT_CODE -ne 0 ]; then
            echo "❌ ERROR: Failed to generate GitHub App Installation token"
            echo "Error details: $GH_TOKEN_OUTPUT"
            echo ""
            echo "Possible causes:"
            echo "  - Invalid or malformed private key (check base64 encoding)"
            echo "  - Incorrect app-id or installation-id"
            echo "  - Private key format issue (must be PEM encoded PKCS1 or PKCS8)"
            echo "⚠️  Skipping PR creation for this action."
            echo ""
            continue
          fi

          export GH_TOKEN="$GH_TOKEN_OUTPUT"

          # Validate token is not empty
          if [ -z "$GH_TOKEN" ] || [ "$GH_TOKEN" = "null" ]; then
            echo "❌ ERROR: GitHub token is empty or null"
            echo "⚠️  Skipping PR creation for this action."
            echo ""
            continue
          fi

          echo "✅ GitHub App Installation token obtained"
          echo ""

          # Check if public repository exists
          echo "🔄 Checking if public repository exists..."
          REPO_INFO=$(gh api repos/"$PUBLIC_REPO" 2>/dev/null)
          if [ -z "$REPO_INFO" ]; then
            echo "⚠️  WARNING: Repository $PUBLIC_REPO does not exist or is not accessible."
            echo "⚠️  Skipping PR creation for this action."
            echo ""
            echo "❌ Repo not accessible" > "$EVIDENCE_DATA_DIR/${ACTION_NAME}.status"
            continue
          fi

          # Check if repository is public
          REPO_PRIVATE=$(echo "$REPO_INFO" | jq -r '.private')
          if [ "$REPO_PRIVATE" = "true" ]; then
            echo "⚠️  WARNING: Repository $PUBLIC_REPO is PRIVATE, not PUBLIC."
            echo "⚠️  This script only syncs to public repositories."
            echo "⚠️  Skipping PR creation for this action."
            echo ""
            echo "❌ Private repo (skipped)" > "$EVIDENCE_DATA_DIR/${ACTION_NAME}.status"
            continue
          fi
          echo "✅ Public repository $PUBLIC_REPO exists and is public"

          BRANCH="update-image-${NEW_VERSION}"

          echo "🔄 Determining default branch of $PUBLIC_REPO..."
          DEFAULT_BRANCH=$(gh api repos/"$PUBLIC_REPO" --jq '.default_branch')
          echo "✅ Default branch of $PUBLIC_REPO is $DEFAULT_BRANCH"

          echo "🔄 Determining latest commit of $DEFAULT_BRANCH branch..."
          LATEST_MAIN_SHA=$(gh api repos/"$PUBLIC_REPO"/git/ref/heads/"$DEFAULT_BRANCH" --jq '.object.sha')
          echo "✅ Latest commit of $DEFAULT_BRANCH is $LATEST_MAIN_SHA"

          # Try to find action.yml or action.yaml
          ACTION_FILE_PATH=""
          for filename in "action.yml" "action.yaml"; do
            echo "🔄 Checking if $filename exists in $PUBLIC_REPO..."
            if gh api repos/"$PUBLIC_REPO"/contents/"$filename"'?ref'="$DEFAULT_BRANCH" --silent 2>/dev/null; then
              ACTION_FILE_PATH="$filename"
              echo "✅ Found action file at $ACTION_FILE_PATH"
              break
            fi
          done

          if [ -z "$ACTION_FILE_PATH" ]; then
            echo "⚠️  ERROR: Neither action.yml nor action.yaml found in $PUBLIC_REPO"
            echo "⚠️  This action may use a different structure. Manual update required."
            echo ""
            echo "❌ No action file found" > "$EVIDENCE_DATA_DIR/${ACTION_NAME}.status"
            continue
          fi

          # Get current file content and SHA
          ACTION_FILE_CONTENT=$(gh api repos/"$PUBLIC_REPO"/contents/"$ACTION_FILE_PATH"'?ref'="$DEFAULT_BRANCH")
          CURRENT_FILE_SHA=$(printf '%s\n' "$ACTION_FILE_CONTENT" | jq -r '.sha')
          CURRENT_CONTENT=$(printf '%s\n' "$ACTION_FILE_CONTENT" | jq -r '.content' | base64 -d)

          # Extract current image version - match action name in image path
          # Look for docker://*/actions/${ACTION_NAME}: pattern
          IMAGE_PATTERN="actions/${ACTION_NAME}:"
          CURRENT_IMAGE=$(echo "$CURRENT_CONTENT" | grep -E '^\s*(image|uses):' | grep -E "docker://.*${IMAGE_PATTERN}" | head -1 | sed -E 's/^\s*(image|uses):\s*//' | tr -d '"' | tr -d "'" | xargs)

          # If not found, try without -actions suffix (e.g., plugin-blackduck-sca)
          if [ -z "$CURRENT_IMAGE" ]; then
            ALT_ACTION_NAME=$(echo "$ACTION_NAME" | sed 's/-actions$//')
            ALT_IMAGE_PATTERN="actions/${ALT_ACTION_NAME}:"
            CURRENT_IMAGE=$(echo "$CURRENT_CONTENT" | grep -E '^\s*(image|uses):' | grep -E "docker://.*${ALT_IMAGE_PATTERN}" | head -1 | sed -E 's/^\s*(image|uses):\s*//' | tr -d '"' | tr -d "'" | xargs)
            if [ -n "$CURRENT_IMAGE" ]; then
              IMAGE_PATTERN="$ALT_IMAGE_PATTERN"
            fi
          fi

          # If still not found, check if it's a Dockerfile-based action
          if [ -z "$CURRENT_IMAGE" ]; then
            DOCKERFILE_CHECK=$(echo "$CURRENT_CONTENT" | grep -E '^\s*(image|uses):' | grep -i "Dockerfile" | head -1)
            if [ -n "$DOCKERFILE_CHECK" ]; then
              echo "⚠️  WARNING: Image uses Dockerfile build"
              echo "⚠️  Skipping image version update. Dockerfile-based actions are built from source."
              echo ""
              echo "⚠️ Dockerfile-based (skipped)" > "$EVIDENCE_DATA_DIR/${ACTION_NAME}.status"
              continue
            fi

            # Check for any docker:// image (fallback for non-standard naming)
            CURRENT_IMAGE=$(echo "$CURRENT_CONTENT" | grep -E '^\s*(image|uses):' | grep -E 'docker://' | head -1 | sed -E 's/^\s*(image|uses):\s*//' | tr -d '"' | tr -d "'" | xargs)
            if [ -z "$CURRENT_IMAGE" ]; then
              echo "⚠️  WARNING: No docker:// image found for actions/${ACTION_NAME}"
              echo "⚠️  This action may use embedded plugins or different image format."
              echo "⚠️  Skipping image version update."
              echo ""
              echo "❌ No matching image found" > "$EVIDENCE_DATA_DIR/${ACTION_NAME}.status"
              continue
            else
              echo "⚠️  WARNING: Found docker:// image but doesn't match expected pattern 'actions/${ACTION_NAME}'"
              echo "   This might update the wrong image. Found: $CURRENT_IMAGE"
              echo "   Expected pattern: docker://*/actions/${ACTION_NAME}:*"
              echo ""
              echo "⚠️ Ambiguous image pattern" > "$EVIDENCE_DATA_DIR/${ACTION_NAME}.status"
              continue
            fi
          fi

          echo "📸 Current image: $CURRENT_IMAGE"

          # Extract current version from image
          CURRENT_VERSION=$(echo "$CURRENT_IMAGE" | grep -oE '[^:]+$' | xargs)
          echo "   Current version: $CURRENT_VERSION"

          # Check if already up-to-date BEFORE building new image
          if [ "$CURRENT_VERSION" = "$NEW_VERSION" ]; then
            echo "✅ Image is already at version $NEW_VERSION. No update needed."
            echo ""
            echo "✅ Already up-to-date" > "$EVIDENCE_DATA_DIR/${ACTION_NAME}.status"
            continue
          fi

          # Determine the new image path
          if echo "$CURRENT_IMAGE" | grep -q "^docker://"; then
            # Extract ECR registry path from current image
            REGISTRY_PATH=$(echo "$CURRENT_IMAGE" | sed 's|^docker://||' | sed 's|:.*$||' | xargs)
            NEW_IMAGE="docker://$REGISTRY_PATH:$NEW_VERSION"
          else
            echo "⚠️  WARNING: Unexpected image format: $CURRENT_IMAGE"
            echo "⚠️  Skipping image version update."
            echo ""
            echo "❌ Unexpected image format" > "$EVIDENCE_DATA_DIR/${ACTION_NAME}.status"
            continue
          fi

          echo "🆕 New image: $NEW_IMAGE"

          # Create or update branch
          echo "🔄 Checking if $BRANCH branch already exists in $PUBLIC_REPO..."
          BRANCH_REF=$(gh api repos/"$PUBLIC_REPO"/git/refs/heads/"$BRANCH" --silent 2>/dev/null || echo "false")

          if [ "$BRANCH_REF" = "false" ]; then
            echo "🔄 Creating $BRANCH in $PUBLIC_REPO..."
            gh api repos/"$PUBLIC_REPO"/git/refs -X POST -f ref="refs/heads/$BRANCH" -f sha="$LATEST_MAIN_SHA" || exit 1
            echo "✅ Branch $BRANCH created from $DEFAULT_BRANCH"

            # Small delay to ensure branch is available
            sleep 2
          else
            # Branch exists - check if it already has the correct version
            echo "🔄 Branch $BRANCH already exists, checking if it has the correct version..."
            BRANCH_FILE_CONTENT=$(gh api repos/"$PUBLIC_REPO"/contents/"$ACTION_FILE_PATH"?ref="$BRANCH" --jq '.content' | base64 -d 2>/dev/null || echo "")
            if [ -n "$BRANCH_FILE_CONTENT" ]; then
              BRANCH_IMAGE=$(echo "$BRANCH_FILE_CONTENT" | grep -E "^\s*(image|uses):" | grep -E "docker://.*${IMAGE_PATTERN}" | head -1 | sed -E 's/^\s*(image|uses):\s*//' | tr -d '"' | tr -d "'")
              BRANCH_VERSION=$(echo "$BRANCH_IMAGE" | grep -oE '[^:]+$')

              if [ "$BRANCH_VERSION" = "$NEW_VERSION" ]; then
                echo "✅ Branch $BRANCH already has version $NEW_VERSION. No update needed."
                echo ""
                echo "✅ Already up-to-date" > "$EVIDENCE_DATA_DIR/${ACTION_NAME}.status"
                continue
              fi
            fi

            echo "🔄 Updating $BRANCH in $PUBLIC_REPO to match $DEFAULT_BRANCH..."
            gh api repos/"$PUBLIC_REPO"/git/refs/heads/"$BRANCH" -X PATCH -f sha="$LATEST_MAIN_SHA" -F "force=true" || exit 1
            echo "✅ Branch $BRANCH updated to match $DEFAULT_BRANCH"
          fi

          # Update the image in action file - use IMAGE_PATTERN for precise matching
          # This ensures we only replace the specific action image, not helper images
          ESCAPED_CURRENT_IMAGE=$(echo "$CURRENT_IMAGE" | sed 's|/|\\/|g')
          ESCAPED_NEW_IMAGE=$(echo "$NEW_IMAGE" | sed 's|/|\\/|g')
          NEW_CONTENT=$(echo "$CURRENT_CONTENT" | sed "s|${ESCAPED_CURRENT_IMAGE}|${ESCAPED_NEW_IMAGE}|g")
          ENCODED_CONTENT=$(echo "$NEW_CONTENT" | base64 -w 0)

          # Commit the change
          echo "🔄 Updating $ACTION_FILE_PATH with new image version..."
          gh api repos/"$PUBLIC_REPO"/contents/"$ACTION_FILE_PATH" -X PUT \
            -f message="Update Docker image to $NEW_VERSION" \
            -f content="$ENCODED_CONTENT" \
            -f sha="$CURRENT_FILE_SHA" \
            -f branch="$BRANCH"
          echo "✅ File $ACTION_FILE_PATH updated on branch $BRANCH"

          # Build PR title and body
          PR_TITLE="Update Docker image to $NEW_VERSION"
          PR_BODY="This PR updates the Docker image to version \`$NEW_VERSION\`."

          # Get previous version from evidence data (already extracted from HEAD~1)
          PREVIOUS_VERSION=$(cat "$EVIDENCE_DATA_DIR/${ACTION_NAME}.old_version" 2>/dev/null || echo "")
          echo "🔍 DEBUG: Raw PREVIOUS_VERSION from file: '$PREVIOUS_VERSION'"
          echo "🔍 DEBUG: NEW_VERSION: '$NEW_VERSION'"

          if [ -n "$PREVIOUS_VERSION" ] && [ "$PREVIOUS_VERSION" != "empty" ]; then
            echo "📜 Previous version: $PREVIOUS_VERSION"
          else
            echo "⚠️  No previous version found"
            PREVIOUS_VERSION=""
          fi

          # Construct comparison URL if we have previous version
          COMPARE_URL=""
          echo "🔍 DEBUG: Checking comparison URL conditions..."
          echo "🔍 DEBUG: PREVIOUS_VERSION is empty? $([ -z "$PREVIOUS_VERSION" ] && echo 'YES' || echo 'NO')"
          echo "🔍 DEBUG: Versions equal? $([ "$PREVIOUS_VERSION" = "$NEW_VERSION" ] && echo 'YES' || echo 'NO')"

          if [ -n "$PREVIOUS_VERSION" ] && [ "$PREVIOUS_VERSION" != "$NEW_VERSION" ]; then
            echo "✅ Conditions met for comparison URL generation"
            # Try to get source repository from CloudBees context
            SOURCE_REPO="${{ cloudbees.scm.repository }}"
            echo "🔍 DEBUG: SOURCE_REPO from context: '$SOURCE_REPO'"
            if [ -z "$SOURCE_REPO" ]; then
              # Fallback: construct from action name
              SOURCE_REPO="calculi-corp/$ACTION_NAME"
              echo "🔍 DEBUG: Using fallback SOURCE_REPO: '$SOURCE_REPO'"
            fi
            COMPARE_URL="https://github.com/${SOURCE_REPO}/compare/${PREVIOUS_VERSION}...${NEW_VERSION}"
            echo "📊 Comparison URL generated: $COMPARE_URL"
            PR_BODY=$(printf '%s\n\n### Changes\n[View changes between %s and %s](%s)' "$PR_BODY" "$PREVIOUS_VERSION" "$NEW_VERSION" "$COMPARE_URL")
          else
            echo "⚠️  Skipping comparison URL generation (conditions not met)"
          fi

          echo "🔍 DEBUG: Final COMPARE_URL: '$COMPARE_URL'"

          # Extract Jira IDs from git log if in source repository
          JIRA_IDS=""
          if [ -n "$PREVIOUS_VERSION" ] && [ "$PREVIOUS_VERSION" != "$NEW_VERSION" ]; then
            echo "🔄 Extracting Jira IDs from commits..."
            GIT_LOG=$(git log --first-parent "${PREVIOUS_VERSION}..${NEW_VERSION}" --pretty=format:"%s%n%b" 2>/dev/null || echo "")
            if [ -n "$GIT_LOG" ]; then
              JIRA_IDS=$(printf '%s\n' "$GIT_LOG" | grep -oE '\[CBP-[0-9]+\]' | sort -u | tr -d '\n' || echo "")
            fi
          fi

          if [ -n "$JIRA_IDS" ]; then
            PR_TITLE="${JIRA_IDS} ${PR_TITLE}"
            echo "🎫 Found Jira IDs: $JIRA_IDS"
          fi

          # Add note about draft status and SRE ticket
          PR_BODY=$(printf '%s\n\n---\n\n⚠️ **Note:** This PR should remain in DRAFT status until the Docker image is available in the public registry.\n\nA Jira ticket will be automatically created for SRE to:\n1. Merge this PR\n2. Create a new tag for the release' "$PR_BODY")

          echo "📝 PR Title: $PR_TITLE"

          # Check for existing PR
          echo "🔄 Checking for pre-existing pull request..."
          EXISTING_PR=$(gh api repos/"$PUBLIC_REPO"/pulls --jq '.[] | select(.head.ref == "'"$BRANCH"'") | .number' | head -n 1)

          if [ -z "$EXISTING_PR" ]; then
            echo "🔄 Creating a new DRAFT pull request..."
            EXISTING_PR=$(gh api repos/"$PUBLIC_REPO"/pulls -X POST \
              -f title="$PR_TITLE" \
              -f head="$BRANCH" \
              -f base="$DEFAULT_BRANCH" \
              -f body="$PR_BODY" \
              -F draft=true \
              --jq '.number')
            echo "✅ Draft pull request created from $BRANCH to $DEFAULT_BRANCH"
          else
            PR_STATE=$(gh api repos/"$PUBLIC_REPO"/pulls/"$EXISTING_PR" --jq '.state')
            if [ "$PR_STATE" = "closed" ]; then
              gh api repos/"$PUBLIC_REPO"/pulls/"$EXISTING_PR" -X PATCH \
                -f state="open" \
                -f title="$PR_TITLE" \
                -f body="$PR_BODY" \
                -F draft=true
              echo "✅ Reopened pull request #$EXISTING_PR as draft"
            else
              gh api repos/"$PUBLIC_REPO"/pulls/"$EXISTING_PR" -X PATCH \
                -f title="$PR_TITLE" \
                -f body="$PR_BODY"
              echo "✅ Pull request #$EXISTING_PR updated"
            fi
          fi

          echo ""
          echo "✅ Draft pull request created at https://github.com/$PUBLIC_REPO/pull/$EXISTING_PR"
          echo ""

          # Update evidence with PR info (append for multiple repos)
          if [ -f "$EVIDENCE_DATA_DIR/${ACTION_NAME}.pr_url" ] && [ "$(cat "$EVIDENCE_DATA_DIR/${ACTION_NAME}.pr_url")" != "-" ]; then
            echo "$(cat "$EVIDENCE_DATA_DIR/${ACTION_NAME}.pr_url"), https://github.com/$PUBLIC_REPO/pull/$EXISTING_PR" > "$EVIDENCE_DATA_DIR/${ACTION_NAME}.pr_url"
          else
            echo "https://github.com/$PUBLIC_REPO/pull/$EXISTING_PR" > "$EVIDENCE_DATA_DIR/${ACTION_NAME}.pr_url"
          fi
          echo "✅ PR Created" > "$EVIDENCE_DATA_DIR/${ACTION_NAME}.status"

          # Get platform-helmfiles PR information
          PLATFORM_HELMFILES_SCM_SHA=${{ cloudbees.scm.sha }}
          PLATFORM_HELMFILES_PR=$(gh api repos/calculi-corp/platform-helmfiles/commits/$PLATFORM_HELMFILES_SCM_SHA/pulls --jq '.[0].url // empty' 2>/dev/null || echo "")
          if [ -z "$PLATFORM_HELMFILES_PR" ]; then
            echo "⚠️ Unable to find the Pull Request for the commit $PLATFORM_HELMFILES_SCM_SHA in calculi-corp/platform-helmfiles."
            echo "⚠️ Skipping Jira ticket creation for this action."
            echo "⚠️ Unable to find platform-helmfiles PR" > "$EVIDENCE_DATA_DIR/${ACTION_NAME}.jira_ticket"
            continue
          fi

          # Get version tags
          ACTION_MAJOR_VERSION=$(gh api repos/$PUBLIC_REPO/tags --jq '.[].name' | grep -E '^v[0-9]+$' | sort -V | tail -1)
          ACTION_MINOR_VERSION=$(gh api repos/$PUBLIC_REPO/tags --jq '.[].name' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)
          if [ -z "$ACTION_MAJOR_VERSION" ] || [ -z "$ACTION_MINOR_VERSION" ]; then
            echo "⚠️ Unable to find the MAJOR/MINOR version tags in $PUBLIC_REPO repository."
            echo "⚠️ Skipping Jira ticket creation for this action."
            echo "⚠️ Missing version tags in $PUBLIC_REPO" > "$EVIDENCE_DATA_DIR/${ACTION_NAME}.jira_ticket"
            continue
          fi

          echo "📌 Latest MAJOR version tag: $ACTION_MAJOR_VERSION"
          echo "📌 Latest MINOR version tag: $ACTION_MINOR_VERSION"
          MAJOR=$(echo $ACTION_MINOR_VERSION | cut -d. -f1)
          MINOR=$(echo $ACTION_MINOR_VERSION | cut -d. -f2)
          PATCH=$(echo $ACTION_MINOR_VERSION | cut -d. -f3)
          NEW_PATCH_VERSION=$((PATCH + 1))
          NEW_MINOR_VERSION="${MAJOR}.${MINOR}.${NEW_PATCH_VERSION}"
          echo "🔖 New version tag to be created: $NEW_MINOR_VERSION"

          # Create Jira ticket
          echo "🔄 Creating Jira ticket for SRE... (CBP SRE Respone Team)"
          JIRA_BASE_URL="https://cloudbees.atlassian.net"
          JIRA_TEAM_FIELD_ID="customfield_12000"
          JIRA_TEAM_ID="de72d37f-5d58-48a5-a466-455eac216fa1"

          JIRA_SUMMARY="[SRE] Merge PR and create release tag for $ACTION_NAME with version $ACTION_MAJOR_VERSION and $NEW_MINOR_VERSION"
          PUBLIC_REPO_PR_URL="https://github.com/$PUBLIC_REPO/pull/$EXISTING_PR"

          # Load Jira description template and replace placeholders
          TEMPLATE_FILE="actions/sync-public-action-versions/jira-ticket-template.json"
          if [ ! -f "$TEMPLATE_FILE" ]; then
            echo "⚠️ Jira template file not found: $TEMPLATE_FILE"
            echo "⚠️ Skipping Jira ticket creation for this action."
            echo "⚠️ Jira template file not found" > "$EVIDENCE_DATA_DIR/${ACTION_NAME}.jira_ticket"
            continue
          fi

          JIRA_DESCRIPTION=$(jq \
            --arg repo "$PUBLIC_REPO" \
            --arg major "$ACTION_MAJOR_VERSION" \
            --arg minor "$NEW_MINOR_VERSION" \
            --arg helmfiles_pr "$PLATFORM_HELMFILES_PR" \
            --arg pr_url "$PUBLIC_REPO_PR_URL" \
            --arg compare "$COMPARE_URL" \
            'walk(if type == "string" then
              gsub("{{PUBLIC_REPO}}"; $repo) |
              gsub("{{ACTION_MAJOR_VERSION}}"; $major) |
              gsub("{{NEW_MINOR_VERSION}}"; $minor) |
              gsub("{{PLATFORM_HELMFILES_PR}}"; $helmfiles_pr) |
              gsub("{{PUBLIC_REPO_PR_URL}}"; $pr_url) |
              gsub("{{COMPARE_URL}}"; $compare)
            else . end)' \
            "$TEMPLATE_FILE")

          # Create Jira payload with optional Team field
          if [ -n "$JIRA_TEAM_FIELD_ID" ] && [ -n "$JIRA_TEAM_ID" ]; then
            echo "📋 Creating ticket to team ID: $JIRA_TEAM_ID (field: $JIRA_TEAM_FIELD_ID)"

            # Now we can use --argjson safely since JIRA_DESCRIPTION is built with jq
            JIRA_PAYLOAD=$(jq -n \
              --arg summary "$JIRA_SUMMARY" \
              --argjson description "$JIRA_DESCRIPTION" \
              --arg team_field "$JIRA_TEAM_FIELD_ID" \
              --arg team_id "$JIRA_TEAM_ID" \
              '{
                fields: (
                  {
                    project: { key: "CBP" },
                    summary: $summary,
                    description: $description,
                    issuetype: { name: "Task" },
                    labels: ["sre", "automation", "public-actions-release"]
                  } + {
                    ($team_field): $team_id
                  }
                )
              }')
          else
            JIRA_PAYLOAD=$(jq -n \
              --arg summary "$JIRA_SUMMARY" \
              --argjson description "$JIRA_DESCRIPTION" \
              '{
                fields: {
                  project: { key: "CBP" },
                  summary: $summary,
                  description: $description,
                  issuetype: { name: "Task" },
                  labels: ["sre", "automation", "public-actions-release"]
                }
              }')
          fi

          # Create Jira ticket using wget
          echo "🔧 Creating Jira ticket via API..."
          # jira-api-token should be in "email:api_token" format, encode it for Basic Auth
          JIRA_AUTH_ENCODED=$(echo -n "${{ inputs.jira-api-token }}" | base64 -w 0 2>/dev/null || echo -n "${{ inputs.jira-api-token }}" | base64)
          echo "$JIRA_PAYLOAD" > /tmp/jira_payload.json
          JIRA_RESPONSE=$(wget -q -O - \
            --header="Content-Type: application/json" \
            --header="Authorization: Basic $JIRA_AUTH_ENCODED" \
            --post-file=/tmp/jira_payload.json \
            "$JIRA_BASE_URL/rest/api/3/issue" 2>&1 || echo '{"error":"wget failed"}')
          rm -f /tmp/jira_payload.json

          # Try to extract ticket key (don't fail if Jira call failed)
          JIRA_TICKET_KEY=$(echo "$JIRA_RESPONSE" | jq -r '.key // empty' 2>/dev/null || echo "")

          if [ -n "$JIRA_TICKET_KEY" ]; then
            echo "✅ Jira ticket created: $JIRA_BASE_URL/browse/$JIRA_TICKET_KEY"
            echo "$JIRA_BASE_URL/browse/$JIRA_TICKET_KEY" > "$EVIDENCE_DATA_DIR/${ACTION_NAME}.jira_ticket"

            # Update PR body to include Jira ticket link
            JIRA_TICKET_URL="$JIRA_BASE_URL/browse/$JIRA_TICKET_KEY"
            UPDATED_PR_BODY=$(printf '%s\n\n📋 **Jira Ticket:** [%s](%s)' "$PR_BODY" "$JIRA_TICKET_KEY" "$JIRA_TICKET_URL")

            echo "🔄 Updating PR #$EXISTING_PR with Jira ticket link..."
            gh api repos/"$PUBLIC_REPO"/pulls/"$EXISTING_PR" -X PATCH \
              -f body="$UPDATED_PR_BODY" 2>/dev/null || echo "⚠️ Failed to update PR body with Jira ticket (non-blocking)"
          else
            echo "⚠️ Failed to create Jira ticket (non-blocking)"
            echo "📋 Response: ${JIRA_RESPONSE:0:200}"
            JIRA_ERROR=$(echo "$JIRA_RESPONSE" | jq -r '.errorMessages[0] // .error // "API call failed"' 2>/dev/null || echo "API call failed")
            echo "⚠️ $JIRA_ERROR" > "$EVIDENCE_DATA_DIR/${ACTION_NAME}.jira_ticket"
          fi

          done  # End of PUBLIC_REPO loop

        done  # End of ACTION_NAME loop

        echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
        echo "Summary"
        echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
        echo "✅ Processed $CHANGED_COUNT changed action(s)"
        echo "🎯 Next steps:"
        echo "   1. Review the draft PRs created in public repositories"
        echo "   2. Verify Docker images are available in public registry"
        echo "   3. Create Jira ticket for SRE (related to CBP-36642)"
        echo "   4. SRE will merge PRs and create release tags"

        # Generate evidence report
        echo ""
        echo "🔄 Generating evidence report..."

        # Set variables for evidence report
        CLOUDBEES_RUN_ID="${{ cloudbees.run_id }}"
        CLOUDBEES_COMMIT_SHA="${{ cloudbees.scm.sha }}"
        CLOUDBEES_BRANCH="${{ cloudbees.scm.branch }}"
        GENERATED_TIME=$(date '+%Y-%m-%d %H:%M:%S UTC')

        # Initialize evidence report with proper formatting
        cat > "$EVIDENCE_FILE" << EVIDENCE_HEADER
        ## Sync Public Action Versions - Evidence Report

        **Generated:** $GENERATED_TIME
        **Workflow Run:** $CLOUDBEES_RUN_ID
        **Commit:** $CLOUDBEES_COMMIT_SHA
        **Branch:** $CLOUDBEES_BRANCH

        ### Actions Changed

        | Action Name | Old Version | New Version | PR Created | Jira Ticket | Status |
        |-------------|-------------|-------------|------------|-------------|--------|
        EVIDENCE_HEADER

        # Count statistics
        SUCCESS_COUNT=0
        ERROR_COUNT=0

        # Build evidence table rows
        for ACTION_NAME in $CHANGED_ACTIONS; do
          OLD_VER=$(cat "$EVIDENCE_DATA_DIR/${ACTION_NAME}.old_version" 2>/dev/null || echo "unknown")
          NEW_VER=$(cat "$EVIDENCE_DATA_DIR/${ACTION_NAME}.new_version" 2>/dev/null || echo "unknown")
          PR_URL=$(cat "$EVIDENCE_DATA_DIR/${ACTION_NAME}.pr_url" 2>/dev/null || echo "-")
          JIRA_TICKET=$(cat "$EVIDENCE_DATA_DIR/${ACTION_NAME}.jira_ticket" 2>/dev/null || echo "-")
          STATUS=$(cat "$EVIDENCE_DATA_DIR/${ACTION_NAME}.status" 2>/dev/null || echo "Unknown")

          # Truncate versions for display (keep first 35 chars)
          OLD_VER_SHORT="$OLD_VER"
          NEW_VER_SHORT="$NEW_VER"
          if [ ${#OLD_VER} -gt 35 ]; then
            OLD_VER_SHORT="$(echo "$OLD_VER" | head -c 32)..."
          fi
          if [ ${#NEW_VER} -gt 35 ]; then
            NEW_VER_SHORT="$(echo "$NEW_VER" | head -c 32)..."
          fi

          # Format PR URL(s) for markdown (handle comma-separated multiple URLs)
          case "$PR_URL" in
            *,*)
              # Multiple URLs - format each
              PR_LINK=""
              for URL in $(echo "$PR_URL" | tr ',' ' '); do
                PR_NUM=$(echo "$URL" | grep -oE '[0-9]+$')
                if [ -n "$PR_LINK" ]; then
                  PR_LINK="$PR_LINK, [PR #$PR_NUM]($URL)"
                else
                  PR_LINK="[PR #$PR_NUM]($URL)"
                fi
              done
              ;;
            https://*)
              PR_NUMBER=$(echo "$PR_URL" | grep -oE '[0-9]+$')
              PR_LINK="[PR #$PR_NUMBER]($PR_URL)"
              ;;
            *)
              PR_LINK="$PR_URL"
              ;;
          esac

          # Format Jira ticket for markdown
          case "$JIRA_TICKET" in
            https://*)
              JIRA_KEY=$(echo "$JIRA_TICKET" | grep -oE 'CBP-[0-9]+$')
              JIRA_LINK="[$JIRA_KEY]($JIRA_TICKET)"
              ;;
            "⚠️ "*)
              JIRA_LINK="$JIRA_TICKET"
              ;;
            *)
              JIRA_LINK="$JIRA_TICKET"
              ;;
          esac

          # Count statistics
          case "$STATUS" in
            *"✅"*)
              SUCCESS_COUNT=$((SUCCESS_COUNT + 1))
              ;;
            *"❌"*|*"⚠️"*)
              ERROR_COUNT=$((ERROR_COUNT + 1))
              ;;
          esac

          # Add table row
          echo "| $ACTION_NAME | \`$OLD_VER_SHORT\` | \`$NEW_VER_SHORT\` | $PR_LINK | $JIRA_LINK | $STATUS |" >> "$EVIDENCE_FILE"
        done

        # Add summary section
        cat >> "$EVIDENCE_FILE" << EVIDENCE_FOOTER

        ---

        ### Summary Statistics

        - **Total Actions Changed:** $CHANGED_COUNT
        - **Successful PR Creations:** $SUCCESS_COUNT
        - **Errors/Warnings:** $ERROR_COUNT

        ### Next Steps

        1. ✅ Review all draft PRs in their respective repositories
        2. ⏳ Wait for Docker images to be available in public registry
        3. 📋 Monitor Jira tickets for SRE team actions
        4. 🏷️ Verify release tags are created after PR merges

        ---

        **Repository:** calculi-corp/platform-helmfiles
        EVIDENCE_FOOTER

        # Output evidence to CloudBees output
        if [ -f "$EVIDENCE_FILE" ]; then
          cat "$EVIDENCE_FILE" > $CLOUDBEES_OUTPUTS/evidence
          echo "✅ Evidence report generated and saved to outputs"
        else
          echo "❌ ERROR: Evidence file not created"
        fi