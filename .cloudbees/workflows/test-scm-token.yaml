apiVersion: automation.cloudbees.io/v1alpha1
kind: workflow
name: Test SCM Token Access

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  scm-token-own: read

jobs:
  test-scm-token:
    steps:
      - name: Test cloudbees.scm.token with public repos
        uses: docker://alpine/git:latest
        env:
          GH_TOKEN: ${{ cloudbees.scm.token }}
        run: |
          set -e

          # Install required tools
          apk add --no-cache curl jq

          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "Testing cloudbees.scm.token access"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo ""

          # Test 1: Check token validity
          echo "🔍 Test 1: Checking token validity..."
          TOKEN_CHECK=$(curl -s -H "Authorization: token $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/user)

          if echo "$TOKEN_CHECK" | jq -e '.login' > /dev/null 2>&1; then
            USER=$(echo "$TOKEN_CHECK" | jq -r '.login')
            echo "✅ Token is valid, authenticated as: $USER"
          else
            echo "❌ Token is invalid or expired"
            echo "Response: $TOKEN_CHECK"
            exit 1
          fi
          echo ""

          # Test 2: Check access to cloudbees-io-gha org repo
          echo "🔍 Test 2: Checking access to cloudbees-io-gha/publish-evidence-item..."
          REPO_CHECK=$(curl -s -w "\n%{http_code}" \
            -H "Authorization: token $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/cloudbees-io-gha/publish-evidence-item)

          HTTP_CODE=$(echo "$REPO_CHECK" | tail -n1)
          RESPONSE=$(echo "$REPO_CHECK" | sed '$d')

          if [ "$HTTP_CODE" = "200" ]; then
            echo "✅ Can access cloudbees-io-gha/publish-evidence-item"
            DEFAULT_BRANCH=$(echo "$RESPONSE" | jq -r '.default_branch')
            echo "   Default branch: $DEFAULT_BRANCH"
          else
            echo "❌ Cannot access cloudbees-io-gha/publish-evidence-item (HTTP $HTTP_CODE)"
            echo "Response: $RESPONSE"
            exit 1
          fi
          echo ""

          # Test 3: Check write permissions (try to read a ref)
          echo "🔍 Test 3: Checking read permissions on refs..."
          REF_CHECK=$(curl -s -w "\n%{http_code}" \
            -H "Authorization: token $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/cloudbees-io-gha/publish-evidence-item/git/refs/heads/$DEFAULT_BRANCH)

          HTTP_CODE=$(echo "$REF_CHECK" | tail -n1)
          RESPONSE=$(echo "$REF_CHECK" | sed '$d')

          if [ "$HTTP_CODE" = "200" ]; then
            SHA=$(echo "$RESPONSE" | jq -r '.object.sha')
            echo "✅ Can read refs"
            echo "   Latest SHA: $SHA"
          else
            echo "❌ Cannot read refs (HTTP $HTTP_CODE)"
            echo "Response: $RESPONSE"
            exit 1
          fi
          echo ""

          # Test 4: Try to create a test branch
          echo "🔍 Test 4: Testing write permissions (create test branch)..."
          TEST_BRANCH="test-scm-token-$(date +%s)"

          CREATE_BRANCH=$(curl -s -w "\n%{http_code}" \
            -X POST \
            -H "Authorization: token $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/cloudbees-io-gha/publish-evidence-item/git/refs \
            -d "{\"ref\":\"refs/heads/$TEST_BRANCH\",\"sha\":\"$SHA\"}")

          HTTP_CODE=$(echo "$CREATE_BRANCH" | tail -n1)
          RESPONSE=$(echo "$CREATE_BRANCH" | sed '$d')

          if [ "$HTTP_CODE" = "201" ]; then
            echo "✅ Can create branches! (Contents: Write permission confirmed)"
            echo "   Created: $TEST_BRANCH"

            # Clean up
            echo "🔄 Cleaning up test branch..."
            curl -s -X DELETE \
              -H "Authorization: token $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              https://api.github.com/repos/cloudbees-io-gha/publish-evidence-item/git/refs/heads/$TEST_BRANCH > /dev/null
            echo "✅ Test branch deleted"
          else
            echo "❌ Cannot create branches (HTTP $HTTP_CODE)"
            echo "Response: $RESPONSE"

            if [ "$HTTP_CODE" = "403" ]; then
              echo ""
              echo "⚠️  HTTP 403 means the token lacks write permissions"
              echo "    Need to use GitHub App with installation IDs instead"
            fi
          fi
          echo ""

          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "✅ Test completed"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
