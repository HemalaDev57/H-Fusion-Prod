apiVersion: automation.cloudbees.io/v1alpha1
kind: Workflow
name: promote-action-artifacts-main

on:
  push:
    branches:
      - "master"

permissions:
  id-token: write
  scm-token-own: read
  scm-token-org: read

jobs:
  promote-actions-main:
    environment: prod
    steps:
      - name: Get source code
        uses: cloudbees-io/checkout@v2
        with:
          ref: master
          fetch-depth: 2

      - name: Detect changed artifacts
        id: check-changes
        uses: docker://python:3.11-slim
        run: |
          apt-get update > /dev/null 2>&1 && apt-get install -y git > /dev/null 2>&1

          if git diff --name-only HEAD~1 HEAD | grep -q "versioning/action_artifacts.json"; then
            # Changes detected - process the artifacts
            echo "action_artifacts.json was modified - detecting changed artifacts"

            # Extract before and after versions
            git show HEAD~1:versioning/action_artifacts.json > /tmp/before.json
            cp versioning/action_artifacts.json /tmp/after.json

            # Try selective filtering - write to workspace directory
            echo "Attempting selective artifact filtering..."
            if python3 support_scripts/filter_changed_artifacts.py /tmp/before.json /tmp/after.json support_scripts/filtered_artifacts.json; then
              echo "✅ Selective filtering successful - promoting only changed artifacts"
              echo -n "support_scripts/filtered_artifacts.json" | tr -d '\n' > $CLOUDBEES_OUTPUTS/input_file
            else
              echo "⚠️  Selective filtering FAILED - falling back to promoting ALL artifacts"
              echo -n "versioning/action_artifacts.json" | tr -d '\n' > $CLOUDBEES_OUTPUTS/input_file
            fi

            echo -n "true" | tr -d '\n' > $CLOUDBEES_OUTPUTS/changed
          else
            # No changes detected
            echo "action_artifacts.json not modified - skipping promotion"
            echo -n "false" | tr -d '\n' > $CLOUDBEES_OUTPUTS/changed
            echo -n "" | tr -d '\n' > $CLOUDBEES_OUTPUTS/input_file
          fi
          ls -lrt
          ls -lrt support_scripts/
          cat $CLOUDBEES_OUTPUTS/input_file
      - name: Sync action versions to public repos
        id: sync-actions
        if: ${{ steps.check-changes.outputs.changed == 'true' }}
        uses: ./actions/sync-public-action-versions
        with:
          app-id: ${{ vars.cloudbees_platform_app_id }}
          calculi-corp-installation-id: ${{ vars.calculi_corp_installation_id }}
          cloudbees-io-installation-id: ${{ vars.cloudbees_io_installation_id }}
          cloudbees-io-gha-installation-id: ${{ vars.cloudbees_io_gha_installation_id }}
          private-key-b64: ${{ secrets.cloudbees_platform_gh_app_key_b64 }}
          input-file: ${{ steps.check-changes.outputs.input_file }}
      - name: Publish workflow evidence
        if: ${{ steps.check-changes.outputs.changed == 'true' }}
        uses: cloudbees-io/publish-evidence-item@v1
        with:
          content: ${{ steps.sync-actions.outputs.evidence-report }}
