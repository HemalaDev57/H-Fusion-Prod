apiVersion: automation.cloudbees.io/v1alpha1
kind: Workflow
name: promote-action-artifacts-main

on:
  push:
    branches:
      - "master"

permissions:
  id-token: write
  scm-token-own: read
  scm-token-org: read

jobs:
  promote-actions-main:
    environment: prod
    steps:
      - name: Get source code
        uses: cloudbees-io/checkout@v2
        with:
          ref: master
          fetch-depth: 2
          
      - name: Check PR labels
        id: check-labels
        uses: docker://alpine:3.20.2
        run: |
          apk add --no-cache curl jq > /dev/null 2>&1

          COMMIT_SHA="${{ cloudbees.scm.sha }}"
          REPO="${{ cloudbees.scm.repository }}"
          GH_TOKEN="${{ cloudbees.scm.token }}"

          echo "🔍 Looking up PR labels for commit $COMMIT_SHA in $REPO..."

          PR_LABELS=$(curl -s \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPO/commits/$COMMIT_SHA/pulls" | \
            jq -r '.[0].labels // [] | .[].name' 2>/dev/null || echo "")

          if [ -z "$PR_LABELS" ]; then
            echo "ℹ️  No PR found for commit $COMMIT_SHA or no labels set"
          else
            echo "📋 PR labels found: $(echo "$PR_LABELS" | tr '\n' ' ')"
          fi

          if echo "$PR_LABELS" | grep -qx "skip-release"; then
            echo "🚫 skip-release label detected — skipping sync and evidence steps"
            echo -n "true" > $CLOUDBEES_OUTPUTS/skip-release
          else
            echo "✅ skip-release label not present"
            echo -n "false" > $CLOUDBEES_OUTPUTS/skip-release
          fi

          if echo "$PR_LABELS" | grep -qx "major-bump"; then
            echo "🔼 major-bump label detected"
            echo -n "true" > $CLOUDBEES_OUTPUTS/major-bump
          else
            echo "ℹ️  major-bump label not present"
            echo -n "false" > $CLOUDBEES_OUTPUTS/major-bump
          fi

      - name: Generate workflow URL
        uses: docker://alpine/curl:latest
        id: workflow_url
        if: ${{ steps.check-labels.outputs.skip-release != 'true' }}
        run: |
          apk add --no-cache jq > /dev/null 2>&1

          # Fetch workflow ID from API
          WORKFLOW_FILE_NAME="promote-action-artifact-main.yaml"
          AUTOMATIONS=$(curl -s -H "Authorization: Bearer ${{ secrets.CBP_API_PAT_RO }}" \
            "${{ cloudbees.api.url }}/v1/organizations/${{ cloudbees.org.id }}/services/${{ cloudbees.component.id }}/automations?all=true&pagination.pageLength=1000&fileName=$WORKFLOW_FILE_NAME")

          WORKFLOW_ID=$(echo "$AUTOMATIONS" | jq -r --arg branch "${{ cloudbees.scm.branch }}" '
            .automations[]? | select(.target.type == "RESOURCE_TYPE_BRANCH" and .target.name == $branch and .fileName == "promote-action-artifact-main.yaml") | .id
          ' 2>/dev/null | head -1)

          WORKFLOW_URL="https://cloudbees.io/cloudbees/${{ cloudbees.org.id }}/components/${{ cloudbees.component.id }}/runs/${WORKFLOW_ID}/${{ cloudbees.run_id }}/${{ cloudbees.run_attempt }}/logs?componentId=${{ cloudbees.component.id }}&workflowId=${WORKFLOW_ID}&organizationId=${{ cloudbees.org.id }}&job=promote-actions-main"
          echo $WORKFLOW_URL
          echo ${{ vars.SLACK_CHANNEL_ID }}
          echo "$WORKFLOW_URL" | tr -d '\n' > $CLOUDBEES_OUTPUTS/url

      - name: Sync action versions to public repos
        id: sync-actions
        if: ${{ steps.check-labels.outputs.skip-release != 'true' }}
        uses: ./actions/sync-public-action-versions
        with:
          app-id: ${{ vars.cloudbees_platform_app_id }}
          calculi-corp-installation-id: ${{ vars.calculi_corp_installation_id }}
          cloudbees-io-installation-id: ${{ vars.cloudbees_io_installation_id }}
          cloudbees-io-gha-installation-id: ${{ vars.cloudbees_io_gha_installation_id }}
          private-key-b64: ${{ secrets.cloudbees_platform_gh_app_key_b64 }}
          major-bump: ${{ steps.check-labels.outputs.major-bump }}
          workflow-url: ${{ steps.workflow_url.outputs.url }}
          slack-channel-id: C05REUUAC1G
          slack-bot-token: ${{ secrets.SAAS_SRE_SLACK_BOT_TOKEN }}
      - name: Publish workflow evidence
        uses: cloudbees-io/publish-evidence-item@v1
        with:
          content: ${{ steps.sync-actions.outputs.evidence-report }}
